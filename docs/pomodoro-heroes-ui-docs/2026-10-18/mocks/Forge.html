<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鍛冶場の手直し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2118;--ink2:#4f4030;--mute:#6e5a43;--faint:#a8987f;
  --paper:#e9dcc0;--paper-hi:#f4ead3;--rule:#c2ae88;--rule2:#b39d74;
  --brass:#9c7424;--brass-hi:#d4a640;--gold:#b98a2c;--seal:#9c3a2e;
  --leather:#4a3526;--leather-b:#5a4330;--wood:#1d1612;--cream:#f1e6cf;
  --ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  --wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>");
}
*{box-sizing:border-box}
body{margin:0;background:#0e0a08;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca;padding:16px 0 40px}
button{font-family:inherit;cursor:pointer;color:inherit}
.num{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-variant-numeric:tabular-nums}
.min{font-family:"Shippori Mincho B1",serif;font-weight:800}

/* ---------- 枠 ---------- */
.frame{position:relative;width:1280px;height:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--wood) var(--wtex);overflow:hidden}
header{height:60px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#16100d;border-bottom:1px solid var(--leather-b)}
.back{height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:6px;border:1.5px solid #a8791f;background:var(--leather);color:var(--cream);font-size:14px}
.ttl{display:flex;align-items:center;gap:12px}
.ttl .dia{width:7px;height:7px;transform:rotate(45deg);background:var(--brass-hi)}
.ttl b{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:23px;letter-spacing:.25em;color:var(--cream);text-shadow:0 2px 0 #000}
.ttl small{display:block;font-size:11px;letter-spacing:.2em;color:var(--faint)}
.money{display:flex;gap:2px;padding:3px;background:#33261d;border:1px solid var(--leather-b);border-radius:10px}
.money span{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:15px}
.money i{width:1px;background:var(--leather-b)}
.ftabs{height:32px;flex-shrink:0;display:flex;align-items:flex-end;gap:4px;padding:0 24px}
.ftab{height:26px;padding:0 20px;border:none;border-radius:7px 7px 0 0;background:#b59e74;color:var(--ink);font-size:13px;position:relative}
.ftab.on{height:32px;background:var(--paper);font-weight:700}
.ftab .mark{position:absolute;right:6px;top:0;width:9px;height:18px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
nav.fac{height:44px;flex-shrink:0;display:flex;background:#231a15;border-top:2px solid #3a2c22}
nav.fac a{flex:1;display:flex;align-items:center;justify-content:center;color:#b3a48c;font-size:14px;text-decoration:none;border-top:3px solid transparent;margin-top:-2px;position:relative}
nav.fac a.on{color:var(--cream);border-top-color:var(--brass-hi);background:#2f241c}
nav.fac a .mark{position:absolute;right:22%;top:-2px;width:10px;height:22px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
main{position:relative;flex-grow:1;min-height:0;padding:8px 24px 8px;display:flex;flex-direction:column;gap:8px}

/* ---------- 紙 ---------- */
.paper{position:relative;background:var(--paper) var(--ptex);color:var(--ink);border-radius:3px;box-shadow:inset 0 0 36px rgba(120,88,40,.3),0 10px 22px rgba(0,0,0,.5)}
.corner{position:absolute;width:14px;height:14px;border:0 solid var(--brass)}
.c1{top:6px;left:6px;border-top-width:2px;border-left-width:2px}.c2{top:6px;right:6px;border-top-width:2px;border-right-width:2px}
.c3{bottom:6px;left:6px;border-bottom-width:2px;border-left-width:2px}.c4{bottom:6px;right:6px;border-bottom-width:2px;border-right-width:2px}

.btn{height:32px;padding:0 14px;border-radius:6px;border:1.5px solid var(--leather-b);background:var(--leather);color:var(--cream);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.brass{border-color:#7a5716;background:var(--gold);color:#1f160f;font-weight:700;box-shadow:inset 0 1px 0 #e0b85c}
.btn.ghost{background:transparent;border:1px solid #8a7458;color:var(--ink)}
.btn.big{height:34px;padding:0 28px;font-size:15px;letter-spacing:.15em}
.btn[disabled]{opacity:.45;cursor:default}
.face{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid #f5ecd8;box-shadow:0 2px 5px rgba(0,0,0,.35);line-height:1}
.icons{display:flex;align-items:center;gap:4px}
.icons .sep{width:1px;height:26px;background:var(--rule2);margin:0 3px}
.seg{display:inline-flex;border:1px solid #8a7458;border-radius:6px;overflow:hidden;height:26px}
.seg button{border:none;background:rgba(244,234,211,.55);font-size:11.5px;padding:0 8px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:#dccaa3;color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--brass)}
.flabel{font-size:11px;color:var(--mute)}
/* ---------- 小さなアイコン ---------- */
.ic{position:relative;flex-shrink:0;display:inline-flex}
.ic .g{position:absolute;top:1px;left:1px;min-width:11px;height:11px;padding:0 2px;border-radius:3px 0 3px 0;font-size:8px;font-weight:700;color:#1b1512;display:flex;align-items:center;justify-content:center}
.ic .st{position:absolute;right:-3px;bottom:-3px}
.up{color:#3f7a2e;font-weight:900}.down{color:var(--seal);font-weight:900}
.btn.danger{background:#8a3327;border-color:#6e2219;color:#fbeee6;font-weight:700}
.demo{width:1280px;margin:12px auto 0;display:flex;gap:8px;align-items:center;font-size:13px;color:#b3a48c}
.demo button{height:32px;padding:0 14px;border-radius:6px;border:1px solid #6a5340;background:#2a1f18;color:#d9ccb4}
.demo button.on{background:var(--gold);color:#1f160f;border-color:#7a5716;font-weight:700}

/* ---------- 鍛冶場 ---------- */
main{flex-direction:row;gap:18px;padding:6px 24px 10px}
.left{flex-grow:1;min-width:0;display:flex;flex-direction:column}
.ttabs{height:40px;flex-shrink:0;display:flex;align-items:flex-end;gap:4px;padding-left:12px}
.tt{height:33px;padding:0 20px;border:none;border-radius:9px 9px 0 0;background:#b59e74;color:var(--ink);font-size:14px;box-shadow:0 -3px 8px rgba(0,0,0,.35)}
.tt.on{height:40px;background:var(--paper);font-weight:700}
.panel{position:relative;flex-grow:1;min-height:0;padding:14px 20px 12px;border-radius:0 3px 3px 3px;display:flex;flex-direction:column;gap:10px}
.ph{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:6px}
.ph b{font-size:19px;letter-spacing:.15em}.ph small{font-size:12px;color:var(--mute)}
/* 並べ替えの欄（育成・持ち物と同じ部品） */
.tool{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tool .pick{height:26px;padding:0 24px 0 10px;border-radius:6px;border:1px solid #8a7458;background:rgba(244,234,211,.6) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1 L5 5 L9 1' fill='none' stroke='%236e5a43' stroke-width='1.5'/></svg>") no-repeat right 8px center;font-size:12px;color:var(--ink)}
.tool .pick em{font-style:normal;color:var(--mute);margin-right:4px}
.tool .chk{height:26px;padding:0 10px;border-radius:6px;border:1px solid #8a7458;background:rgba(244,234,211,.6);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px}
.tool .chk i{width:13px;height:13px;border:1.5px solid #6e5a43;border-radius:2px;display:inline-block}
.tool .chk.on i{background:var(--ink);border-color:var(--ink)}
.box{flex-grow:1;min-height:0;overflow-y:auto;padding:8px 6px 6px 4px;scrollbar-width:thin;scrollbar-color:#8a7458 transparent}
.egrid{display:grid;grid-template-columns:repeat(12,56px);gap:16px 10px;align-content:start}
.cell{position:relative;width:56px;height:56px;padding:0;border:none;background:none}
.cell .ico{display:inline-flex}
.cell.on::after{content:"";position:absolute;inset:-4px;border-radius:10px;box-shadow:0 0 0 2px var(--brass-hi),0 0 12px rgba(224,184,92,.6)}
.cell.max .ico{opacity:.55}
.who-dot{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;border:1.5px solid #f5ecd8;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.tagb{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:0 5px;height:15px;border-radius:8px;font-size:9.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center}
.tagb.max{background:#6e5a43;color:#f1e6cf}
.tagb.relic{background:#5b3f7a;color:#efe4ff}
.erow{display:grid;grid-template-columns:44px minmax(0,1fr) 90px 150px 110px;align-items:center;gap:12px;height:52px;padding:0 10px;border:none;border-bottom:1px dotted var(--rule2);background:transparent;width:100%;text-align:left;color:var(--ink)}
.erow.on{background:var(--paper-hi);box-shadow:inset 3px 0 0 var(--brass)}
.legend{display:flex;gap:16px;font-size:11px;color:var(--mute);padding-top:6px;border-top:1px dashed var(--rule)}
/* 右：鍛える紙 */
.side{width:372px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;padding-top:40px;padding-bottom:2px}
.skill{padding:10px 16px;display:flex;align-items:center;gap:14px;transform:rotate(-.5deg)}
.work{flex-grow:1;min-height:0;padding:14px 18px;display:flex;flex-direction:column;gap:10px;transform:rotate(.3deg)}
.vs{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;justify-items:center;padding:6px 0}
.vs .c{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.stamp{display:flex;flex-direction:column;align-items:center;padding:6px 14px;border:2px solid #3f7a2e;border-radius:50%;color:#3f7a2e;transform:rotate(-6deg)}
.stamp.risk{border-color:#9c6a1e;color:#9c6a1e}
.mat{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--rule);font-size:13px}
.tick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px dashed #8a7458;border-radius:4px;font-size:13px;background:transparent;color:var(--ink);width:100%;text-align:left}
.tick i{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px}
.tick[disabled]{opacity:.45;cursor:default}
.tipcard{position:absolute;z-index:9;width:270px;padding:12px 14px;pointer-events:none;display:none;flex-direction:column;gap:6px;box-shadow:0 0 0 1px #5a4330,0 14px 30px rgba(0,0,0,.6);font-size:12px}
.tipcard.show{display:flex}
.tipcard .tr{display:flex;justify-content:space-between;align-items:baseline}
.tipcard hr{border:none;border-top:1px dashed var(--rule);margin:2px 0;width:100%}
/* 鍛えた結果（押すと飛ばせる） */
.res{position:absolute;inset:0;z-index:20;display:none;background:radial-gradient(ellipse at 50% 45%,rgba(60,36,18,.88),rgba(8,5,3,.95));align-items:center;justify-content:center;flex-direction:column;gap:18px;cursor:pointer}
.res.show{display:flex}
.skip{position:absolute;right:28px;bottom:24px;height:34px;padding:0 16px;border-radius:17px;border:1px solid #8a7458;background:rgba(27,21,18,.7);color:#d9ccb4;font-size:13px;display:flex;align-items:center;gap:8px}
.anvil{position:relative;width:240px;height:200px}
.hammer{position:absolute;left:120px;top:0;transform-origin:20px 90px;animation:swing .5s ease-in infinite}
@keyframes swing{0%{transform:rotate(-55deg)}70%{transform:rotate(8deg)}100%{transform:rotate(-55deg)}}
.spark{position:absolute;left:112px;top:96px;width:6px;height:6px;border-radius:50%;background:#ffd36b;box-shadow:0 0 8px #ffb02e;opacity:0;animation:spark .5s ease-out infinite}
@keyframes spark{0%,60%{opacity:0;transform:translate(0,0)}70%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.rcard{width:620px;padding:26px 34px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;cursor:default;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.bigstamp{padding:8px 26px;border:4px solid #3f7a2e;border-radius:8px;color:#3f7a2e;font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:34px;letter-spacing:.3em;transform:rotate(-6deg);animation:stamp .4s cubic-bezier(.2,1.6,.4,1)}
.bigstamp.ng{border-color:#9c3a2e;color:#9c3a2e}
@keyframes stamp{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.cell.lock .ico{filter:brightness(.45) saturate(.4);opacity:.6}
.cell.lock{cursor:not-allowed}
.cell.pk .ico{filter:sepia(.6) hue-rotate(-30deg) brightness(.75)}
.cell.pk::after{content:"";position:absolute;inset:-3px;border-radius:10px;box-shadow:0 0 0 2.5px #9c3a2e}
.chkm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#8a3327;border:2px solid #fbeee6;color:#fbeee6;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.lockm{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:0 5px;height:15px;border-radius:8px;background:#4a3526;color:#d9ccb4;font-size:9.5px;white-space:nowrap;display:flex;align-items:center}
.scrapbar{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:5px;background:rgba(156,58,46,.1);border:1px dashed #9c3a2e}
.scrapbar .chk{height:26px;padding:0 10px;border-radius:6px;border:1px solid #8a7458;background:rgba(244,234,211,.6);font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px}
.scrapbar .chk i{display:none}
.ask{position:absolute;left:50%;top:50%;width:520px;transform:translate(-50%,-50%);z-index:25;padding:24px 28px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 0 0 1px #5a4330,0 24px 60px rgba(0,0,0,.8)}
.askscrim{position:absolute;inset:0;z-index:24;background:rgba(10,7,5,.7)}
.btn.danger{background:#8a3327;border-color:#6e2219;color:#fbeee6;font-weight:700}
.from{display:flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 12px;border-radius:15px;background:#2a1f18;border:1px solid var(--brass);font-size:12px;color:var(--cream)}
</style>
</head>
<body>
<div class="frame" id="frame">
  <header>
    <div style="display:flex;align-items:center;gap:18px">
      <button class="back" id="back"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#d4a640" stroke-width="2"><path d="M9 2 L4 7 L9 12"/></svg><span id="backl">戻る</span></button>
      <div class="ttl"><span class="dia"></span><div><b>鍛冶場</b><small id="sub">装備を鍛える</small></div><span class="dia"></span></div>
      <span id="from"></span>
    </div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="money" title="鍛えるのに使う素材"><span><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#5aa0e6" stroke-width="1.6"><path d="M3 14 L6 8 H14 L17 14 Z"/><path d="M8 8 L7 14 M12 8 L13 14"/></svg>鍛冶の塊 <b class="num">99,983</b></span></div>
      <div class="money"><span><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="#d4a640" stroke-width="1.6"><circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="3.5"/></svg><b class="num">100</b></span><i></i><span><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="#9cc98a" stroke-width="1.6"><path d="M10 2 L4 10 H9 L8 16 L14 8 H9 Z"/></svg><b class="num">20</b><small style="color:#a8987f;font-size:11px">/ 100</small></span></div>
    </div>
  </header>
  <div class="ftabs"><button class="ftab">キャラ<span class="mark"></span></button><button class="ftab">詰所</button><button class="ftab on">鍛冶場</button><button class="ftab">研究<span class="mark"></span></button></div>
  <main>
    <section class="left">
      <div class="ttabs"><button class="tt on">鍛える</button><button class="tt">作る</button><button class="tt">遺物</button></div>
      <div class="paper panel" id="panel"></div>
    </section>
    <section class="side" id="side"></section>
  </main>
  <div class="paper tipcard" id="tip"></div>
  <div class="res" id="res"></div>
  <nav class="fac"><a>本部</a><a>冒険</a><a class="on">育成<span class="mark"></span></a><a>持ち物<span class="mark"></span></a><a>記録</a><a>ショップ<span class="mark"></span></a></nav>
</div>
<div class="demo">見本の切り替え：
  <button data-v="grid" class="on">マス目</button>
  <button data-v="list">行</button>
  <button data-v="from">育成（剣士）から来た</button><button data-v="anim">鍛えている途中</button><button data-v="ok">結果：成功</button><button data-v="ng">結果：失敗</button><button data-v="scrap">一括分解（等級2以下を選んだ）</button><button data-v="scrapask">分解の確認</button>
</div>
<script>
const GRADE={1:'#d8d0c2',2:'#7fbf6a',3:'#5aa0e6',4:'#4f7fe0',5:'#9a6ce0',6:'#d066b0',7:'#e05a5a',8:'#e08a3a',9:'#e0b040',10:'#f2e6a0'};
const PART={head:'頭',body:'上半身',legs:'下半身',weapon:'武器',acc:'アクセサリー'};
const PARTS=['head','body','legs','weapon','acc'];
const GLYPH={
  head:'<path d="M18 36 C18 24 24 18 32 18 C40 18 46 24 46 36 Z"/><path d="M16 36 H48 V41 H16 Z"/>',
  body:'<path d="M22 20 L28 18 C29 22 35 22 36 18 L42 20 L47 29 L41 31 V46 H23 V31 L17 29 Z"/>',
  legs:'<path d="M23 18 H31 V44 L21 46 V40 L23 38 Z"/><path d="M33 18 H41 V38 L43 40 V46 L33 44 Z"/>',
  weapon:'<path d="M19 45 L41 23 L45 19"/><path d="M38 19 L45 26"/><path d="M21 38 L26 43"/>',
  acc:'<circle cx="32" cy="37" r="9"/><path d="M28 24 L32 19 L36 24 L32 28 Z"/>'
};
const SK={ /* スキルの線アイコン（24枠） */
  strike:'<path d="M5 19 L19 5 M12 5 H19 V12"/>',
  sweep:'<path d="M4 16 C7 8 17 8 20 16"/><path d="M16 12 L20 16 L15 18"/>',
  heal:'<path d="M12 20 C6 16 4 12 6 8 C8 5 11 6 12 8 C13 6 16 5 18 8 C20 12 18 16 12 20 Z"/><path d="M12 10.5 V15.5 M9.5 13 H14.5"/>',
  shield:'<path d="M12 3 L19 6 V11 C19 16 15.5 19 12 21 C8.5 19 5 16 5 11 V6 Z"/>',
  arrow:'<path d="M4 20 L18 6 M12 5 H19 V12 M4 14 L8 18"/>',
  rain:'<path d="M6 4 V12 M12 4 V14 M18 4 V12 M4 18 H20"/>',
  bolt:'<path d="M13 3 L6 13 H11 L10 21 L18 10 H13 Z"/>',
  skull:'<circle cx="12" cy="10" r="6"/><path d="M9 16 V20 H15 V16"/>',
  fire:'<path d="M12 21 C7 19 6 14 9 10 C10 13 12 13 12 9 C12 6 14 4 15 3 C15 8 19 10 18 15 C17 19 14 21 12 21 Z"/>',
  star:'<path d="M12 3 L14 9 L20 9 L15 13 L17 20 L12 16 L7 20 L9 13 L4 9 L10 9 Z"/>',
};
const face=(c,s)=>`<span class="face" style="width:${s}px;height:${s}px;background:${c.c};font-size:${Math.round(s*.55)}px">${c.e}</span>`;
function eqIcon(part,grade,s=26,opt={}){

const F=document.getElementById('frame'), TIP=document.getElementById('tip');
F.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.view) view=d.view;
  else if(d.sort){ if(sortK===d.sort) desc=!desc; else { sortK=d.sort; desc=true; } }
  else if(d.part) partF=d.part;
  else if(d.star!==undefined) starOnly=!starOnly;
  else if(d.cell){ const x=INV[+d.cell]; if(scrap){ if(!x.w){ picked.has(x.k)?picked.delete(x.k):picked.add(x.k); } } else sel=+d.cell; }
  else if(d.scrap!==undefined){ scrap=!scrap; picked.clear(); }
  else if(d.upto){ list().forEach(x=>{ if(!x.w&&!x.st&&x.g<=+d.upto) picked.add(x.k); }); }
  else if(d.allp!==undefined){ list().forEach(x=>{ if(!x.w&&!x.st) picked.add(x.k); }); }
  else if(d.none!==undefined){ picked.clear(); }
  else if(d.doscrap!==undefined){ askScrap=true; }
  else if(d.askno!==undefined){ askScrap=false; }
  else if(d.askok!==undefined){ const P=[...picked].map(k=>INV[k]); scrapDone={n:P.length,sum:P.reduce((a,x)=>a+ret(x),0)}; P.forEach(x=>{const i=INV.indexOf(x); INV.splice(i,1);}); INV.forEach((x,i)=>x.k=i); picked.clear(); askScrap=false; sel=0; }
  else if(d.okdone!==undefined){ scrapDone=null; }
  else if(d.ticket!==undefined) ticket=!ticket;
  else if(d.from!==undefined) from=false;
  else if(d.hit){ startForge(d.hit==='safe'); return; }
  else if(d.again!==undefined){ startForge(false); return; }
  else if(d.rclose!==undefined){ closeRes(); return; }
  else return;
  draw();
});
function card(x){
  return `<div style="display:flex;gap:10px;align-items:center">${eqIcon(x.p,x.g,46,{star:x.st})}<span style="display:flex;flex-direction:column;gap:2px"><b class="min" style="font-size:16px">${x.n}</b><span class="flabel">等級${x.g}・${PART[x.p]}</span></span></div><hr>
   <div class="tr"><span style="display:flex;align-items:center;gap:5px">${stIcon(STAT[x.p][0])}${STAT[x.p][1]}</span><b class="num" style="font-size:18px">+${fmt(x.p,x.v)}</b></div>
   ${x.sub?`<div class="tr"><span class="flabel">ほかの能力</span><span>${x.sub}</span></div>`:''}
   ${x.fx?`<div style="padding:6px 8px;border:1px solid #d4a640;border-radius:4px;background:rgba(224,184,92,.12)"><b style="color:#7a5716">★ 特殊効果</b><br>${x.fx}</div>`:''}
   <div class="tr"><span class="flabel">次の等級</span><span>${x.g>=10?'最大':'等級'+(x.g+1)+'（成功 '+(x.g<5?100:Math.max(40,100-(x.g-4)*12))+'%）'}</span></div>
   ${x.w?`<div class="tr"><span class="flabel">着けている人</span><span style="display:flex;align-items:center;gap:5px">${faceOf(x.w)}${CH[x.w][0]}</span></div>`:''}`;
}
F.addEventListener('mouseover',e=>{
  const t=e.target.closest('[data-tip]'); if(!t){TIP.classList.remove('show');return;}
  TIP.innerHTML=card(INV[+t.dataset.tip]); TIP.classList.add('show');
  const fr=F.getBoundingClientRect(), r=t.getBoundingClientRect();
  let L=r.right-fr.left+10, T=r.top-fr.top; if(L+280>1280) L=r.left-fr.left-280; if(T+TIP.offsetHeight>700) T=700-TIP.offsetHeight;
  TIP.style.left=L+'px'; TIP.style.top=T+'px';
});
F.addEventListener('mouseleave',()=>TIP.classList.remove('show'));
document.querySelectorAll('.demo button').forEach(b=>b.onclick=()=>{const v=b.dataset.v; if(v==='from'){from=true;view='grid';partF='weapon';sel=0;} else {from=false;view=v;partF='all';} draw();});
if(location.search.includes('from=')){from=true;partF='weapon';sel=0;}
document.getElementById('back').onclick=()=>{ if(from) location.href='Training.html'; };
const RES=document.getElementById('res'); let rt=null, pending=null;
function startForge(safe){
  const x=INV[sel]; if(x.g>=10) return;
  const steps=[]; let g=x.g, v=x.v;
  const one=()=>{const rate=g<5?100:ticket?100:Math.max(40,100-(g-4)*12); const ok=Math.random()*100<rate||forceRes==='ok'; const res=forceRes==='ng'?false:ok; const nv=res?Math.round(v*1.18+1):v; steps.push({g0:g,g1:res?g+1:g,v0:v,v1:nv,ok:res,rate}); if(res){g++;v=nv;} };
  if(safe){ while(g<5) one(); if(!steps.length) one(); } else one();
  pending={x,steps};
  RES.innerHTML=`<div class="anvil"><svg width="240" height="200" viewBox="0 0 240 200"><path d="M40 120 H190 C190 140 170 148 150 148 H130 L124 172 H160 V188 H70 V172 H106 L100 148 C70 148 40 140 40 120 Z" fill="#3a2c22" stroke="#d4a640" stroke-width="2"/><path d="M190 120 L224 110" stroke="#d4a640" stroke-width="3"/></svg>
    <svg class="hammer" width="60" height="110" viewBox="0 0 60 110"><rect x="16" y="20" width="8" height="80" rx="3" fill="#8a6a44"/><rect x="0" y="4" width="44" height="22" rx="3" fill="#5b5048" stroke="#cfc6b8" stroke-width="2"/></svg>
    ${[[-60,-40],[50,-50],[-30,-70],[70,-20],[-80,-10]].map(([a,b],i)=>`<span class="spark" style="--x:${a}px;--y:${b}px;animation-delay:${i*.04}s"></span>`).join('')}</div>
    <div style="font-family:'Shippori Mincho B1',serif;font-weight:800;font-size:22px;letter-spacing:.3em;color:#f1e6cf">${x.n} を鍛えている…</div>
    <button class="skip" data-skip>押すと飛ばす ▶▶</button>`;
  RES.classList.add('show'); clearTimeout(rt); rt=setTimeout(showResult,1800);
}
function showResult(){
  clearTimeout(rt); if(!pending) return; const {x,steps}=pending; pending=null;
  const last=steps[steps.length-1], first=steps[0], okAll=steps.some(s=>s.ok), allOk=steps.every(s=>s.ok);
  const g1=last.g1, v1=last.v1;
  if(okAll){ x.g=g1; x.v=v1; }
  const cost=steps.length*20;
  RES.innerHTML=`<div class="paper rcard" data-stop><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <span class="bigstamp ${okAll?'':'ng'}">${okAll?(allOk?'成功':'一部成功'):'失敗'}</span>
    <div style="display:flex;align-items:center;gap:26px">
      <span style="display:flex;flex-direction:column;align-items:center;gap:4px">${eqIcon(x.p,first.g0,72,{star:x.st})}<span class="flabel">鍛える前</span><b class="num">${STAT[x.p][1]} +${fmt(x.p,first.v0)}</b></span>
      <svg width="44" height="20" viewBox="0 0 48 20" fill="none" stroke="#2b2118" stroke-width="2.5"><path d="M2 10 H44 M36 3 L44 10 L36 17"/></svg>
      <span style="display:flex;flex-direction:column;align-items:center;gap:4px">${eqIcon(x.p,g1,72,{star:x.st})}<span class="flabel">いま</span><b class="num" style="color:${okAll?'#3f7a2e':'#2b2118'}">${STAT[x.p][1]} +${fmt(x.p,v1)}${okAll?` <span class="up">（+${fmt(x.p,v1-first.v0)}）</span>`:''}</b></span>
    </div>
    <b class="min" style="font-size:20px">${x.n}　等級 ${first.g0} → ${g1}</b>
    ${steps.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">${steps.map(s=>`<span style="padding:2px 8px;border-radius:10px;font-size:11px;border:1px solid ${s.ok?'#3f7a2e':'#9c3a2e'};color:${s.ok?'#3f7a2e':'#9c3a2e'}">${s.g0}→${s.g1} ${s.ok?'成功':'失敗'}</span>`).join('')}</div>`:''}
    ${okAll?'':'<span style="font-size:13px;color:#6e5a43">失敗しても等級は下がらない。素材は使った。</span>'}
    <div style="display:flex;gap:20px;font-size:12px;color:#6e5a43"><span>使った鍛冶の塊 <b class="num" style="color:#2b2118">${cost}</b></span><span>鍛冶の腕　次まで あと <b class="num" style="color:#2b2118">${Math.max(0,5-steps.length)}</b> 回</span></div>
    ${g1===5&&okAll?'<span style="font-size:12px;color:#5b3f7a;font-weight:700">等級5になった。遺物に捧げられる</span>':''}
    <div style="display:flex;gap:10px;width:100%;margin-top:4px"><button class="btn ghost" data-rclose style="flex:1;justify-content:center;height:42px">閉じる</button><button class="btn brass" data-again style="flex:2;justify-content:center;height:42px;font-size:15px" ${g1>=10?'disabled':''}>続けて鍛える</button></div>
  </div><span style="position:absolute;bottom:22px;color:#a8987f;font-size:12px">外を押しても閉じる</span>`;
  draw();
}
function closeRes(){ RES.classList.remove('show'); RES.innerHTML=''; pending=null; clearTimeout(rt); draw(); }
let forceRes=null;
RES.addEventListener('click',e=>{
  const b=e.target.closest('button'); 
  if(b&&b.dataset.again!==undefined){ e.stopPropagation(); forceRes=null; startForge(false); return; }
  if(b&&b.dataset.rclose!==undefined){ e.stopPropagation(); closeRes(); return; }
  if(e.target.closest('[data-stop]')) { e.stopPropagation(); return; }
  e.stopPropagation();
  if(pending) showResult(); else closeRes();   // 途中で押す→飛ばす／結果の外を押す→閉じる
});
document.querySelectorAll('.demo button').forEach(b=>{ const v=b.dataset.v; if(v==='scrap'||v==='scrapask') b.onclick=()=>{ closeRes(); view='grid'; partF='all'; scrap=true; picked.clear(); list().forEach(x=>{ if(!x.w&&!x.st&&x.g<=2) picked.add(x.k); }); askScrap=v==='scrapask'; scrapDone=null; draw(); document.querySelectorAll('.demo button').forEach(c=>c.classList.toggle('on',c===b)); }; if(['anim','ok','ng'].includes(v)) b.onclick=()=>{ closeRes(); sel=0; INV[0].g=6; INV[0].v=11; forceRes=v==='ng'?'ng':'ok'; startForge(false); if(v!=='anim') showResult(); else clearTimeout(rt); }; });
draw();
</script>
</body>
</html>
