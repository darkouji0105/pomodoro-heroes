<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>詰所の手直し</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2118;--ink2:#4f4030;--mute:#6e5a43;--faint:#a8987f;
  --paper:#e9dcc0;--paper-hi:#f4ead3;--rule:#c2ae88;--rule2:#b39d74;
  --brass:#9c7424;--brass-hi:#d4a640;--gold:#b98a2c;--seal:#9c3a2e;
  --leather:#4a3526;--leather-b:#5a4330;--wood:#1d1612;--cream:#f1e6cf;
  --ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");
  --wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>");
}
*{box-sizing:border-box}
body{margin:0;background:#0e0a08;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca;padding:16px 0 40px}
button{font-family:inherit;cursor:pointer;color:inherit}
.num{font-family:"Noto Sans JP",sans-serif;font-weight:900;font-variant-numeric:tabular-nums}
.min{font-family:"Shippori Mincho B1",serif;font-weight:800}

/* ---------- 枠 ---------- */
.frame{position:relative;width:1280px;height:720px;margin:0 auto;display:flex;flex-direction:column;background:var(--wood) var(--wtex);overflow:hidden}
header{height:60px;flex-shrink:0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#16100d;border-bottom:1px solid var(--leather-b)}
.back{height:40px;padding:0 14px;display:flex;align-items:center;gap:6px;border-radius:6px;border:1.5px solid #a8791f;background:var(--leather);color:var(--cream);font-size:14px}
.ttl{display:flex;align-items:center;gap:12px}
.ttl .dia{width:7px;height:7px;transform:rotate(45deg);background:var(--brass-hi)}
.ttl b{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:23px;letter-spacing:.25em;color:var(--cream);text-shadow:0 2px 0 #000}
.ttl small{display:block;font-size:11px;letter-spacing:.2em;color:var(--faint)}
.money{display:flex;gap:2px;padding:3px;background:#33261d;border:1px solid var(--leather-b);border-radius:10px}
.money span{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:15px}
.money i{width:1px;background:var(--leather-b)}
.ftabs{height:32px;flex-shrink:0;display:flex;align-items:flex-end;gap:4px;padding:0 24px}
.ftab{height:26px;padding:0 20px;border:none;border-radius:7px 7px 0 0;background:#b59e74;color:var(--ink);font-size:13px;position:relative}
.ftab.on{height:32px;background:var(--paper);font-weight:700}
.ftab .mark{position:absolute;right:6px;top:0;width:9px;height:18px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
nav.fac{height:44px;flex-shrink:0;display:flex;background:#231a15;border-top:2px solid #3a2c22}
nav.fac a{flex:1;display:flex;align-items:center;justify-content:center;color:#b3a48c;font-size:14px;text-decoration:none;border-top:3px solid transparent;margin-top:-2px;position:relative}
nav.fac a.on{color:var(--cream);border-top-color:var(--brass-hi);background:#2f241c}
nav.fac a .mark{position:absolute;right:22%;top:-2px;width:10px;height:22px;background:var(--seal);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}
main{position:relative;flex-grow:1;min-height:0;padding:8px 24px 8px;display:flex;flex-direction:column;gap:8px}

/* ---------- 紙 ---------- */
.paper{position:relative;background:var(--paper) var(--ptex);color:var(--ink);border-radius:3px;box-shadow:inset 0 0 36px rgba(120,88,40,.3),0 10px 22px rgba(0,0,0,.5)}
.corner{position:absolute;width:14px;height:14px;border:0 solid var(--brass)}
.c1{top:6px;left:6px;border-top-width:2px;border-left-width:2px}.c2{top:6px;right:6px;border-top-width:2px;border-right-width:2px}
.c3{bottom:6px;left:6px;border-bottom-width:2px;border-left-width:2px}.c4{bottom:6px;right:6px;border-bottom-width:2px;border-right-width:2px}

/* ---------- 帯（依頼 / 詰所の案内） ---------- */
.strip{height:40px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 6px 0 16px}
.strip .kind{font-size:11px;color:var(--mute);letter-spacing:.1em}
.strip .q{font-size:19px;letter-spacing:.12em}
.strip .note{font-size:12px;color:var(--mute)}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1.5px solid var(--leather-b);background:var(--leather);color:var(--cream);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.brass{border-color:#7a5716;background:var(--gold);color:#1f160f;font-weight:700;box-shadow:inset 0 1px 0 #e0b85c}
.btn.ghost{background:transparent;border:1px solid #8a7458;color:var(--ink)}
.btn.big{height:34px;padding:0 28px;font-size:15px;letter-spacing:.15em}
.btn[disabled]{opacity:.45;cursor:default}

/* ---------- 本体：左（3枠＋控え）／右（名簿） ---------- */
.body{flex-grow:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 396px;gap:16px}
.left{min-height:0;display:flex;flex-direction:column;gap:14px}
.top{flex-grow:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.slot{padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px}
.slot:nth-child(1){transform:rotate(-.6deg)}.slot:nth-child(2){transform:rotate(.4deg)}.slot:nth-child(3){transform:rotate(-.3deg)}
.shead{display:flex;align-items:center;gap:8px}
.shead .no{font-size:30px;line-height:1}
.shead .pl{font-size:11px;letter-spacing:.15em;color:var(--mute)}
.out{margin-left:auto;height:26px;padding:0 10px;border-radius:13px;border:1px solid #8a7458;background:transparent;font-size:11px;color:var(--ink);display:flex;align-items:center;gap:4px}
.out:hover{border-color:var(--seal);color:var(--seal)}
.who{display:flex;align-items:center;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.face{flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;border:2px solid #f5ecd8;box-shadow:0 2px 5px rgba(0,0,0,.35);line-height:1}
.nm{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm b{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:22px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{font-size:11px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;color:var(--mute);padding:5px 2px;border-top:1px solid var(--ink);border-bottom:1px dashed var(--rule)}
.stats span{display:flex;flex-direction:column}
.stats b{font-size:16px;color:var(--ink)}
.build{flex-grow:1;padding:6px 7px;gap:3px !important;background:rgba(244,234,211,.75);border:1px solid var(--rule2);border-radius:3px;display:flex;flex-direction:column;gap:7px}
.bhead{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}
.bpill{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:1.5px solid #8a7458;background:transparent;font-size:12px;font-weight:700;color:var(--mute);padding:0;display:flex;align-items:center;justify-content:center}
.bpill.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.bpill.empty{border-style:dashed;color:var(--faint)}
.bname{font-size:13px;color:var(--ink);font-weight:700;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icons{display:flex;align-items:center;gap:4px}
.icons .sep{width:1px;height:26px;background:var(--rule2);margin:0 3px}
.bfoot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.link{border:none;background:none;padding:0;font-size:12px;color:#7a5716;font-weight:700;display:flex;align-items:center;gap:4px}
.link.sub{color:var(--mute);font-weight:400}
.move{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--mute)}
.arrow{height:24px;padding:0 10px;border-radius:12px;border:1px solid #8a7458;background:transparent;font-size:11px;color:var(--ink);display:flex;align-items:center;gap:4px}
.arrow[disabled]{opacity:.35;cursor:default}
.slot.empty{background:rgba(233,220,192,.35);box-shadow:none;border:2px dashed #8a7458;align-items:center;justify-content:center;text-align:center;color:#d9ccb4}
.slot.empty .shead{position:absolute;top:12px;left:14px}
.slot.empty .no{color:#d9ccb4}

/* 控え（下の横長） */
.reserve{height:148px;flex-shrink:0;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;transform:rotate(.25deg)}
.reserve .rh{display:flex;align-items:center;gap:12px}
.reserve .rh b{font-size:17px;letter-spacing:.15em}
.rtiles{flex-grow:1;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:7px}
.rt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-radius:4px;border:1px solid var(--rule2);background:rgba(244,234,211,.7);color:var(--ink);padding:0}
.rt .n{position:absolute;top:3px;left:6px;font-size:12px;color:var(--mute)}
.rt .mf{display:flex;gap:2px}
.rt .bn{font-size:10px;color:var(--mute)}
.rt.empty{border-style:dashed;background:transparent;color:var(--faint);font-size:11px}
.rt.on{background:var(--paper-hi);box-shadow:inset 0 0 0 2px var(--brass)}

/* 名簿（右の縦長） */
.roster{min-height:0;padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;transform:rotate(.3deg)}
.rhead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:5px}
.rhead h3{margin:0;font-size:19px;letter-spacing:.2em}
.rhead .cnt{font-size:12px;color:var(--mute)}
.hint{font-size:11.5px;color:var(--mute);line-height:1.5}
.hint b{color:#7a5716}
.hint.warn{color:#fbeee6;background:var(--seal);border-radius:3px;padding:2px 8px;font-weight:700}
.seg{display:inline-flex;border:1px solid #8a7458;border-radius:6px;overflow:hidden;height:26px}
.seg button{border:none;background:rgba(244,234,211,.55);font-size:11.5px;padding:0 8px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--rule2)}
.seg button.on{background:#dccaa3;color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--brass)}
.flabel{font-size:11px;color:var(--mute)}
.frow{display:flex;align-items:center;gap:8px}
.grid{flex-grow:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:54px;gap:8px 7px;padding:6px 6px 2px 0;scrollbar-width:thin;scrollbar-color:#8a7458 transparent}
.pc{position:relative;display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:4px;border:1px solid var(--rule2);background:rgba(244,234,211,.7);text-align:left;color:var(--ink)}
.pc:hover{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.pc .t{flex-grow:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pc .t b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .t small{font-size:10.5px;color:var(--mute);white-space:nowrap}
.pc .pw{display:flex;flex-direction:column;align-items:flex-end;font-size:9px;color:var(--mute)}
.pc .pw b{font-size:14px;color:var(--ink)}
.pc.dep{background:#dccaa3;border-color:#8a7458}
.pc.dep .t small{color:var(--seal);font-weight:700}
.seal{position:absolute;top:-7px;right:-4px;padding:0 5px;height:18px;border:1.5px solid var(--seal);background:var(--paper-hi);color:var(--seal);font-size:10px;font-weight:700;border-radius:3px;transform:rotate(6deg);display:flex;align-items:center}

/* ---------- 小さなアイコン ---------- */
.ic{position:relative;flex-shrink:0;display:inline-flex}
.ic .g{position:absolute;top:1px;left:1px;min-width:11px;height:11px;padding:0 2px;border-radius:3px 0 3px 0;font-size:8px;font-weight:700;color:#1b1512;display:flex;align-items:center;justify-content:center}
.ic .st{position:absolute;right:-3px;bottom:-3px}

/* ---------- ビルドを組む（重ねる紙） ---------- */
.desk{position:absolute;left:64px;right:64px;top:34px;bottom:26px;display:none;grid-template-columns:260px minmax(0,1fr) 380px;grid-template-rows:46px minmax(0,1fr) auto;z-index:3;box-shadow:0 0 0 1px #5a4330,0 24px 60px rgba(0,0,0,.75)}
.wbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;background:#2a1f18;color:var(--cream);border-bottom:2px solid var(--brass);border-radius:3px 3px 0 0}
.wbar b{font-size:17px;letter-spacing:.15em}
.wx{margin-left:auto;width:34px;height:34px;border-radius:6px;border:1px solid #6a5340;background:#3a2c22;color:#e9dcc0;display:flex;align-items:center;justify-content:center;padding:0}
.use{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--mute);border:none;background:none;padding:0}
.use i{width:14px;height:14px;border-radius:50%;border:1.5px solid #8a7458;display:inline-block;box-sizing:border-box}
.use.on{color:var(--seal);font-weight:700}.use.on i{border:4px solid var(--seal)}
.desk.show{display:grid}
.scrim{position:absolute;inset:0;background:rgba(10,7,5,.7);display:none;z-index:2}
.scrim.show{display:block}
.dcol{padding:14px 18px;display:flex;flex-direction:column;gap:8px;min-height:0}
.dcol+.dcol{border-left:1px solid var(--rule)}
.dh{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:5px}
.dh b{font-size:17px;letter-spacing:.15em}
.dh small{font-size:11px;color:var(--mute)}
.btab{display:flex;flex-direction:column;gap:4px;padding:6px 9px;border:1px solid var(--rule2);border-radius:3px;background:transparent;text-align:left;color:var(--ink)}
.btab.on{background:var(--paper-hi);box-shadow:inset 3px 0 0 var(--brass),0 0 0 1px var(--brass)}
.btab .r1{display:flex;align-items:center;gap:8px;font-size:13px}
.slotbox{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1.5px solid var(--rule2);border-radius:4px;background:rgba(244,234,211,.6);text-align:left;color:var(--ink);width:100%}
.slotbox:hover{border-color:var(--brass)}
.slotbox.on{border-color:var(--brass);background:var(--paper-hi);box-shadow:0 0 0 2px rgba(212,166,64,.45)}
.slotbox .k{font-size:10.5px;color:var(--mute)}
.slotbox .v{font-size:14px;font-weight:700}
.slotbox .d{font-size:11px;color:var(--mute)}
.eqgrid{display:grid;grid-template-columns:repeat(6,52px);gap:8px}
.cell{position:relative;width:52px;height:52px;padding:0;border:none;background:none}
.cell.on::after{content:"";position:absolute;inset:-4px;border-radius:10px;box-shadow:0 0 0 2px var(--brass-hi),0 0 12px rgba(224,184,92,.6)}
.who-dot{position:absolute;right:-4px;top:-4px;width:18px;height:18px;border-radius:50%;border:1.5px solid #f5ecd8;font-size:10px;display:flex;align-items:center;justify-content:center}
.cmp{display:flex;flex-direction:column;gap:3px;padding:8px 10px;background:rgba(244,234,211,.7);border:1px dashed #8a7458;border-radius:3px;font-size:12px}
.cmp div{display:flex;justify-content:space-between}
.up{color:#3f7a2e;font-weight:900}.down{color:var(--seal);font-weight:900}

.bdel{margin-left:auto;width:26px;height:26px;border-radius:5px;border:1px solid var(--rule2);background:transparent;color:var(--mute);display:flex;align-items:center;justify-content:center;padding:0}
.bdel:hover{color:var(--seal);border-color:var(--seal)}
.sttab{display:flex;flex-direction:column}
.sr{display:flex;align-items:center;gap:8px;height:21px;border-bottom:1px dotted var(--rule2);font-size:12px}
.sr .l{flex-grow:1;color:var(--ink2)}
.sr b{font-size:14px;width:52px;text-align:right}
.sr .d{width:40px;text-align:right;font-size:11px}
.brow{display:flex;align-items:center;gap:8px;height:46px;padding:0 6px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink);text-align:left;width:100%}
.brow:hover{border-color:var(--rule2)}
.brow.on{background:var(--paper-hi);border-color:var(--brass);box-shadow:inset 3px 0 0 var(--brass)}
.brow .bn2{width:auto;line-height:1.1;flex-shrink:0;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .icons{gap:2px}.brow .icons .sep{height:18px;margin:0 2px}
.brow:not(.on) .icons{opacity:.75}
.cell.other .ico{filter:brightness(.5) saturate(.5);opacity:.75}
.cell .ico{display:inline-flex}
.mine{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:0 5px;height:15px;border-radius:8px;background:var(--brass);color:#fbeee6;font-size:9.5px;font-weight:700;white-space:nowrap;display:flex;align-items:center}
.who-dot{width:22px !important;height:22px !important;font-size:12px !important;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.eqgrid{row-gap:14px !important}
/* 確認の窓 */
.ask{position:absolute;left:50%;top:50%;width:460px;transform:translate(-50%,-50%) rotate(-.4deg);z-index:5;display:none;flex-direction:column;align-items:center;gap:14px;padding:26px 30px 22px;text-align:center;box-shadow:0 0 0 1px #5a4330,0 24px 60px rgba(0,0,0,.8)}
.ask.show{display:flex}
.ask h4{margin:0;font-size:21px;letter-spacing:.15em}
.ask .what{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:rgba(244,234,211,.8);border:1px solid var(--rule2);border-radius:4px}
.ask p{margin:0;font-size:13px;color:var(--mute);line-height:1.7}
.ask .row{display:flex;gap:12px;width:100%}
.ask .row .btn{flex:1;justify-content:center;height:46px;font-size:15px}
.btn.danger{background:#8a3327;border-color:#6e2219;color:#fbeee6;font-weight:700}
/* 見本の切り替え（枠の外） */
.demo{width:1280px;margin:12px auto 0;display:flex;gap:8px;align-items:center;font-size:13px;color:#b3a48c}
.demo button{height:32px;padding:0 14px;border-radius:6px;border:1px solid #6a5340;background:#2a1f18;color:#d9ccb4}
.demo button.on{background:var(--gold);color:#1f160f;border-color:#7a5716;font-weight:700}
</style>
</head>
<body>

<div class="frame" id="frame">
  <header>
    <div style="display:flex;align-items:center;gap:18px">
      <button class="back"><svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="#d4a640" stroke-width="2"><path d="M9 2 L4 7 L9 12"/></svg>戻る</button>
      <div class="ttl"><span class="dia"></span><div><b id="ttl">詰所</b><small id="sub">出撃の並びと控え</small></div><span class="dia"></span></div>
    </div>
    <div class="money">
      <span><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="#d4a640" stroke-width="1.6"><circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="3.5"/></svg><b class="num">100</b></span><i></i>
      <span><svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="#9cc98a" stroke-width="1.6"><path d="M10 2 L4 10 H9 L8 16 L14 8 H9 Z"/></svg><b class="num">20</b><small style="color:#a8987f;font-size:11px">/ 100</small></span>
    </div>
  </header>
  <div class="ftabs" id="ftabs">
    <button class="ftab">キャラ<span class="mark"></span></button>
    <button class="ftab on">詰所</button>
    <button class="ftab">鍛冶場</button>
    <button class="ftab">研究<span class="mark"></span></button>
  </div>

  <main id="main">
    <div class="paper strip" id="strip"></div>
    <div class="body">
      <div class="left"><div class="top" id="top"></div><div class="paper reserve" id="reserve"></div></div>
      <div class="paper roster" id="roster"></div>
    </div>
  </main>

  <nav class="fac">

function statRows(c,it,cur){
  const sp=x=>{const m=/攻撃速度 \+(\d+)%/.exec(x.sub||'');return m?+m[1]:0};
  const rows=[['hp','HP',c.hp,0,''],['atk','攻撃',c.m[1],it.atk-cur.atk,''],['mag','魔力',4,0,''],['pdef','物理防御',6,0,''],['mdef','魔法防御',4,0,''],
    ['aspd','攻撃速度',sp(cur),sp(it)-sp(cur),'%'],['cd','CD短縮',0,0,'%'],['crit','会心率',5,0,'%'],['critx','会心倍率',150,0,'%'],['move','移動速度',60,0,'']];
  return rows.map(([k,l,v,d,u])=>`<div class="sr"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#6e5a43" stroke-width="1.4" stroke-linejoin="round">${STI[k]}</svg><span class="l">${l}</span><b class="num">${v+d}${u}</b><span class="d ${d>0?'up':d<0?'down':''}">${d?(d>0?'+':'')+d+u:''}</span></div>`).join('');
}
function drawDesk(){
  const d=document.getElementById('desk'); const c=byId[deskId]; const b=c.b[deskB]||{n:'',s:[null,null],q:{}};
  const it=INV[deskCell]; const cur=INV[0];
  d.innerHTML=`<div class="wbar">${face(c,30)}<b class="min">${c.n}　ビルドと装備</b><span style="font-size:12px;color:#b3a48c">${c.r}・Lv ${c.lv}</span><button class="wx" data-close title="閉じる"><svg width="12" height="12" viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.8"><path d="M1 1 L9 9 M9 1 L1 9"/></svg></button></div>
  <div class="dcol">
    <div class="dh"><b class="min">ビルドを切り替える</b><small>3つまで</small></div>
    ${[0,1,2].map(k=>{const x=c.b[k];const u=k===(useB[deskId]||0);return `<div class="btab ${k===deskB?'on':''}" data-db="${k}" role="button" style="cursor:pointer"><span class="r1"><b class="num" style="font-size:16px;color:${k===deskB?'#9c7424':'#6e5a43'}">${k+1}</b>${x?`<b>${x.n}</b>`:'<span style="color:#a8987f">空き・押して組む</span>'}${x?`<button class="use ${u?'on':''}" data-use="${k}" title="出撃でこのビルドを使う"><i></i>${u?'出撃で使う':'これを使う'}</button>`:''}</span><span style="display:flex;align-items:center;gap:6px">${buildIcons(x,20)}${x?`<button class="bdel" data-bdel="${k}" title="このビルドを消す"><svg width="13" height="14" viewBox="0 0 13 14" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1 3 H12 M4.5 3 V1.5 H8.5 V3 M2.5 3 L3.3 13 H9.7 L10.5 3"/></svg></button>`:''}</span></div>`}).join('')}
    <div class="dh" style="margin-top:4px"><b class="min">ステータス</b><small>${it.n}を着けたら</small></div>
    <div class="sttab">${statRows(c,it,cur)}</div>
    <div style="margin-top:auto;font-size:10.5px;color:var(--mute)">ノードとパッシブの振り直しは <b style="color:#7a5716">育成 ›</b></div>
  </div>
  <div class="dcol">
    <div class="dh"><b class="min">ビルド${deskB+1}の中身</b><small>枠を押すと右に候補が出る</small></div>
    <div style="display:flex;align-items:center;gap:8px"><span class="flabel">名前</span><span style="flex-grow:1;border-bottom:1.5px solid var(--ink);padding:2px 4px;font-size:15px;font-weight:700">${b.n||'（名前なし）'} <span style="font-size:11px;color:var(--faint);font-weight:400">✎</span></span></div>
    <div class="flabel" style="margin-top:2px">スキル　2つ</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      ${[0,1].map(k=>`<button class="slotbox ${deskSlot==='s'+k?'on':''}" data-dslot="s${k}"><span class="num" style="font-size:18px;color:#9c7424">${k+1}</span>${skIcon(b.s[k],36)}<span style="display:flex;flex-direction:column"><span class="v">${b.s[k]==='strike'?'強撃':b.s[k]==='sweep'?'横薙ぎ':'空き'}</span><span class="d">${b.s[k]?'CD '+(b.s[k]==='strike'?'6.0':'8.0')+' 秒':'押して選ぶ'}</span></span></button>`).join('')}
    </div>
    <div class="flabel" style="margin-top:2px">装備　5つ</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      ${PARTS.map(p=>{const g=b.q[p]||0;const name={head:'鉄の兜',body:'革の鎧',weapon:'細身の剣'}[p];return `<button class="slotbox ${deskSlot===p?'on':''}" data-dslot="${p}" style="padding:5px 10px">${eqIcon(p,g,38)}<span style="display:flex;flex-direction:column;flex-grow:1"><span class="k">${PART[p]}</span><span class="v" style="${g?'':'color:#a8987f;font-weight:400'}">${g?name:'空き'}</span></span>${deskSlot===p?'<span style="font-size:11px;color:#7a5716;font-weight:700">右で選ぶ ›</span>':''}</button>`}).join('')}
    </div>
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)"><span>ルーン</span><span style="padding:2px 10px;border:1px dashed #8a7458;border-radius:10px">空き</span></div>
  </div>
  ${deskSlot[0]==='s'?skillPicker(b):`<div class="dcol" style="background:rgba(244,234,211,.45)">
    <div class="dh"><b class="min">${PART[deskSlot]}を選ぶ</b><small>持っている ${INV.length} 本</small></div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <span class="seg"><button class="on" title="マス目">▦ マス目</button><button title="行">☰ 行</button></span>
      <span class="seg"><button class="on">いつもの順</button><button>等級</button><button>名前</button></span>
      <span class="seg"><button>★だけ</button></span>
    </div>
    <div class="eqgrid">${INV.map((x,k)=>`<button class="cell ${k===deskCell?'on':''} ${x.w&&x.w!==deskId?'other':''}" data-cell="${k}" title="${x.n}"><span class="ico">${eqIcon('weapon',x.g,52,{star:x.st})}</span>${x.w&&x.w!==deskId?`<span class="who-dot" style="background:${byId[x.w].c}">${byId[x.w].e}</span>`:''}${x.w===deskId?'<span class="mine">着用中</span>':''}</button>`).join('')}</div>
    <div style="font-size:10.5px;color:var(--mute);display:flex;gap:12px"><span>左上の数＝等級</span><span>★＝特殊効果</span><span>右上の顔＝いま着けている人</span></div>
    <div class="cmp" style="margin-top:auto">
      <div style="align-items:center;gap:10px;justify-content:flex-start">${eqIcon('weapon',it.g,40,{star:it.st})}<span style="display:flex;flex-direction:column"><b style="font-size:15px">${it.n}</b><span style="color:var(--mute)">等級${it.g}・${it.sub||'—'}</span></span></div>
      <div><span>攻撃</span><span class="num">34 → ${34-cur.atk+it.atk} <span class="${it.atk>=cur.atk?'up':'down'}">${it.atk>=cur.atk?'+':''}${it.atk-cur.atk}</span></span></div>
      <div><span>いまの武器</span><span>${cur.n}（等級${cur.g}）と入れ替え</span></div>
      ${it.w&&it.w!==deskId?`<div><span style="color:#9c3a2e">${byId[it.w].n} が着けている</span><span>外して着ける</span></div>`:''}
    </div>
    <div style="display:flex;gap:8px"><button class="btn ghost" style="flex:1;justify-content:center;height:36px">外す</button><button class="btn brass" style="flex:2;justify-content:center;height:36px;font-size:14px">${it.n} を着ける</button></div>
  </div>`}
`;
  d.insertAdjacentHTML('beforeend',`<div style="grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--rule);background:rgba(220,202,163,.35)">
    <span class="flabel">変えたところ：武器・スキル2　（まだ残していない）</span><span style="margin-left:auto"></span>
    <button class="btn ghost" data-close style="height:36px">残さずに閉じる</button>
    <button class="btn" style="height:36px">別の番号に残す…</button>
    <button class="btn brass" data-close style="height:36px;padding:0 22px;font-size:14px">ビルド${deskB+1}に残して閉じる</button>
  </div>`);
}

function drawAsk(){
  const a=document.getElementById('ask'), sc=document.getElementById('scrim2');
  a.classList.toggle('show',!!ask); sc.classList.toggle('show',!!ask); if(!ask) return;
  let title,what,note;
  if(ask.k==='res'){ const r=reserve[ask.i];
    title=`編成の控え ${ask.i+1} を消す？`;
    what=r.p.map((id,n)=>`<span style="display:flex;flex-direction:column;align-items:center;gap:3px">${face(byId[id],44)}<span style="font-size:11px">${byId[id].n}・ビルド${r.b[n]}</span></span>`).join('');
    note='消すのは控えに残した「並び」だけ。<br>キャラやビルドはそのまま残る。';
  } else { const c=byId[deskId], b=c.b[ask.i];
    title=`ビルド${ask.i+1}「${b.n}」を消す？`;
    what=`${face(c,44)}<span style="display:flex;flex-direction:column;gap:6px;align-items:flex-start"><b style="font-size:14px">${c.n}　ビルド${ask.i+1}</b>${buildIcons(b,26)}</span>`;
    note='スキル・装備・ノードの振り方の組み合わせが消える。<br>装備そのものは持ち物に戻る。'+((useB[deskId]||0)===ask.i?'<br><b style="color:#9c3a2e">いま出撃で使っているビルド。消すと別の番号に切り替わる。</b>':'');
  }
  a.innerHTML=`<span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
    <h4 class="min">${title}</h4><div class="what">${what}</div><p>${note}</p>
    <div class="row"><button class="btn ghost" data-askno>やめる</button><button class="btn danger" data-askok>消す</button></div>`;
}
function draw(){
  document.getElementById('ttl').textContent = mode==='sortie'?'出撃の準備':'詰所';
  document.getElementById('sub').textContent = mode==='sortie'?'出撃届':'出撃の並びと控え';
  document.getElementById('ftabs').style.display = mode==='sortie'?'none':'flex';
  drawStrip(); drawTop(); drawRoster();
  const show = mode==='desk';
  document.getElementById('desk').classList.toggle('show',show);
  document.getElementById('scrim').classList.toggle('show',show);
  if(show) drawDesk();
  drawAsk();
}

/* ===== 押したとき ===== */
document.getElementById('frame').addEventListener('click',e=>{
  const t=e.target.closest('button,[data-db]'); if(!t) return;
  const ds=t.dataset;
  note='';
  if(ds.out!==undefined){ party[+ds.out]=null; }
  else if(ds.pc){
    const at=party.indexOf(ds.pc);
    if(at>=0) party[at]=null;                       // 出ている人 → 外れる
    else { const e=party.indexOf(null); if(e>=0){ party[e]=ds.pc; useB[ds.pc]=useB[ds.pc]||0; } else note='枠がいっぱい。先に出ている人を押して外す'; }
  }
  else if(ds.mv){ const [i,d]=ds.mv.split(':').map(Number); const j=i+d; [party[i],party[j]]=[party[j],party[i]]; }
  else if(ds.b){ const [id,k]=ds.b.split(':'); if(byId[id].b[+k]) useB[id]=+k; else { deskId=id; deskB=+k; mode='desk'; } }
  else if(ds.desk){ deskId=ds.desk; deskB=useB[ds.desk]||0; mode='desk'; }
  else if(ds.close!==undefined){ mode='barracks'; }
  else if(ds.use){ useB[deskId]=+ds.use; deskB=+ds.use; }
  else if(ds.db){ deskB=+ds.db; }
  else if(ds.rdel!==undefined){ ask={k:'res',i:reserveSel}; }
  else if(ds.bdel){ ask={k:'build',i:+ds.bdel}; }
  else if(ds.askok!==undefined){ if(ask.k==='res') reserve[ask.i]=null; else { byId[deskId].b[ask.i]=null; if((useB[deskId]||0)===ask.i) useB[deskId]=byId[deskId].b.findIndex(Boolean); } ask=null; }
  else if(ds.askno!==undefined){ ask=null; }
  else if(ds.dslot){ deskSlot=ds.dslot; }
  else if(ds.sk){ /* 見本：選ぶだけ */ }
  else if(ds.cell){ deskCell=+ds.cell; }
  else if(ds.sort){ sortKey=ds.sort; }
  else if(ds.role){ roleF=ds.role; }
  else if(ds.rs){ reserveSel=+ds.rs; }
  else return;
  syncDemo(); draw();
});
function syncDemo(){
  const v = ask?(ask.k==='res'?'del':'bdel'):mode==='desk'?'desk':mode==='sortie'?'sortie':party.includes(null)?'out':'barracks';
  document.querySelectorAll('.demo button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
document.querySelectorAll('.demo button').forEach(b=>b.onclick=()=>{
  const v=b.dataset.v; note=''; party=['so','yumi','ken'];
  if(v==='barracks') mode='barracks';
  if(v==='out'){ mode='barracks'; party=['so',null,'ken']; }
  if(v==='sortie') mode='sortie';
  ask=null; reserve=RES0(); byId.ken.b[1]=byId.ken.b[1]||{n:'捨て身',s:['strike',null],q:{weapon:3}};
  if(v==='desk'){ mode='desk'; deskId='ken'; deskB=0; }
  if(v==='del'){ mode='barracks'; reserveSel=1; ask={k:'res',i:1}; }
  if(v==='bdel'){ mode='desk'; deskId='ken'; deskB=1; ask={k:'build',i:1}; }
  syncDemo(); draw();
});
draw();
</script>
</body>
</html>
