<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>依頼を受ける（署名）</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Yuji+Boku&amp;family=Klee+One:wght@600&amp;family=Zen+Kurenaido&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#140f0c;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca}
button{font-family:inherit;cursor:pointer}
a{color:#d4a640}a:hover{color:#e9c46a}
:root{--ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");--wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>")}
.tip{position:relative;outline:none}.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#2b2118;color:#f1e6cf;font-size:12px;font-weight:500;font-family:'Noto Sans JP',sans-serif;z-index:5;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}.tip:focus-visible{box-shadow:0 0 0 2px #9c7424;border-radius:3px}
.glow{box-shadow:0 0 0 1.5px #d4a640, 0 0 14px rgba(224,184,92,.55)}


@keyframes signA{0%,7%{clip-path:inset(-20% 100% -20% 0)}21%,100%{clip-path:inset(-20% -10% -20% 0)}}
@keyframes signB{0%,25%{clip-path:inset(-20% 100% -20% 0)}39%,100%{clip-path:inset(-20% -10% -20% 0)}}
@keyframes signC{0%,43%{clip-path:inset(-20% 100% -20% 0)}57%,100%{clip-path:inset(-20% -10% -20% 0)}}
@keyframes stamp{0%,64%{opacity:0;transform:rotate(-14deg) scale(1.9)}68%{opacity:1;transform:rotate(-14deg) scale(0.94)}71%,100%{opacity:0.92;transform:rotate(-14deg) scale(1)}}
@keyframes paperIn{0%{transform:translateY(0) rotate(-2.2deg)}66%{transform:translateY(0) rotate(-2.2deg)}68%{transform:translateY(3px) rotate(-2.2deg)}71%,100%{transform:translateY(0) rotate(-2.2deg)}}
.sig-a{animation:signA 7s linear infinite}
.sig-b{animation:signB 7s linear infinite}
.sig-c{animation:signC 7s linear infinite}
.seal{animation:stamp 7s ease-out infinite}
.paper{animation:paperIn 7s linear infinite}
@media (prefers-reduced-motion: reduce){.sig-a,.sig-b,.sig-c,.seal,.paper{animation:none}}
</style>

</head>
<body>

<div style="width: 1280px; height: 720px; box-sizing: border-box; position: relative; background: #1d1612 var(--wtex); font-family: 'Noto Sans JP', sans-serif; color: #eadfca; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 40px; padding: 40px 56px 40px 72px">

  <!-- 依頼書（傾いた紙） -->
  <div style="display: flex; align-items: center; justify-content: center">
    <article class="paper" style="position: relative; width: 600px; height: 630px; box-sizing: border-box; padding: 38px 48px 36px; background: #eadcbf var(--ptex); color: #2b2118; border-radius: 3px; transform: rotate(-2.2deg); box-shadow: inset 0 0 50px rgba(120,88,40,0.35), 0 18px 40px rgba(0,0,0,0.6); display: flex; flex-direction: column">
      <div style="position: absolute; top: -9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #9c3a2e; box-shadow: 0 3px 4px rgba(0,0,0,0.5)"></div>

      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 15px; letter-spacing: 0.5em; color: #6e5a43">依頼書</span>
        <span style="font-size: 12px; color: #6e5a43">シナリオ　第3話</span>
      </div>
      <h1 style="margin: 10px 0 0; font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 44px; letter-spacing: 0.06em">荒野の群れ</h1>
      <p style="margin: 10px 0 0; font-size: 14px; line-height: 1.8; color: #4f4030">[依頼の一文：何が起きていて、なぜ行くのか]</p>
      <div style="display: flex; gap: 28px; margin-top: 14px; padding: 10px 0; border-top: 1px solid #c9b58e; border-bottom: 1px solid #c9b58e; font-size: 13px; color: #4f4030">
        <span>消費　スタミナ 5</span>
        <span>発行　ギルド本部</span>
      </div>

      <div style="margin-top: 22px; font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 14px; letter-spacing: 0.3em; color: #6e5a43">受ける者</div>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
        <div style="position: relative; height: 70px; display: flex; align-items: flex-end; gap: 14px">
          <span style="width: 40px; font-size: 11px; color: #8a7458; padding-bottom: 6px">剣士</span>
          <div style="position: relative; flex-grow: 1; height: 100%; border-bottom: 1px solid #a8926a">
            <span class="sig-a" style="position: absolute; left: 14px; bottom: 2px; display: flex; align-items: flex-end; gap: 6px; transform: rotate(-4deg); transform-origin: left bottom; font-family: 'Yuji Boku', serif; font-size: 46px; line-height: 1; color: #1e1814">剣士<svg width="46" height="40" viewBox="0 0 46 40" fill="none" stroke="#1e1814" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M4 34 L40 6"></path><path d="M10 10 C18 18 26 26 38 34"></path></svg></span>
          </div>
        </div>
        <div style="position: relative; height: 70px; display: flex; align-items: flex-end; gap: 14px">
          <span style="width: 40px; font-size: 11px; color: #8a7458; padding-bottom: 6px">弓兵</span>
          <div style="position: relative; flex-grow: 1; height: 100%; border-bottom: 1px solid #a8926a">
            <span class="sig-b" style="position: absolute; left: 60px; bottom: 6px; display: flex; align-items: flex-end; gap: 8px; transform: rotate(2.5deg); transform-origin: left bottom; font-family: 'Klee One', serif; font-weight: 600; font-size: 36px; line-height: 1; color: #24324e">弓兵<svg width="56" height="22" viewBox="0 0 56 22" fill="none" stroke="#24324e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 11 H50"></path><path d="M42 5 L52 11 L42 17"></path><path d="M4 11 L10 4 M8 11 L14 4 M4 11 L10 18 M8 11 L14 18"></path></svg></span>
          </div>
        </div>
        <div style="position: relative; height: 70px; display: flex; align-items: flex-end; gap: 14px">
          <span style="width: 40px; font-size: 11px; color: #8a7458; padding-bottom: 6px">僧侶</span>
          <div style="position: relative; flex-grow: 1; height: 100%; border-bottom: 1px solid #a8926a">
            <span class="sig-c" style="position: absolute; left: 28px; bottom: 4px; display: flex; align-items: flex-end; gap: 4px; transform: rotate(-6deg); transform-origin: left bottom; font-family: 'Zen Kurenaido', sans-serif; font-size: 40px; line-height: 1; color: #3a2a45">僧侶<svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#3a2a45" stroke-width="2" stroke-linecap="round" aria-hidden="true"><ellipse cx="17" cy="9" rx="11" ry="4"></ellipse><path d="M17 16 V30 M11 22 H23"></path></svg></span>
          </div>
        </div>
      </div>

      <!-- マスターの判 -->
      <div style="margin-top: auto; display: flex; justify-content: flex-end; align-items: flex-end; gap: 14px">
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; padding-bottom: 10px">
          <span style="font-size: 11px; color: #8a7458">承認</span>
          <span style="font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 15px; color: #4f4030">ギルドマスター</span>
        </div>
        <div style="position: relative; width: 104px; height: 104px; border-radius: 50%; border: 1.5px dashed #b39d74; display: flex; align-items: center; justify-content: center">
          <div class="seal" style="position: absolute; inset: 4px; border-radius: 50%; border: 3px solid #b0372a; box-shadow: inset 0 0 0 3px #eadcbf, inset 0 0 0 4.5px #b0372a; color: #b0372a; display: flex; flex-direction: column; align-items: center; justify-content: center; transform: rotate(-14deg); opacity: 0.92">
            <span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: 0.05em">受理</span>
            <span style="font-size: 9px; letter-spacing: 0.2em; margin-top: 4px; font-weight: 700">ギルド本部</span>
          </div>
        </div>
      </div>
    </article>
  </div>

  <!-- 右：操作とサインの見本 -->
  <aside style="display: flex; flex-direction: column; gap: 22px; padding-top: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; letter-spacing: 0.12em; color: #a8987f">依頼を受ける</span>
      <h2 style="margin: 0; font-family: 'Shippori Mincho B1', serif; font-weight: 700; font-size: 26px; color: #f1e6cf">3人が名前を書きました</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.8; color: #cbbca3">マスターの判を押すと、3人が出発します。</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px 18px; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 3px; box-shadow: 0 10px 22px rgba(0,0,0,0.5)">
      <span style="font-size: 12px; color: #6e5a43">3人のサイン</span>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: 1px dashed #c2ae88">
        <span style="font-family: 'Yuji Boku', serif; font-size: 30px; color: #1e1814; transform: rotate(-4deg)">剣士</span>
        <span style="font-size: 11px; color: #6e5a43; text-align: right">太い筆・勢い<br>印：交差した二本線</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-bottom: 1px dashed #c2ae88">
        <span style="font-family: 'Klee One', serif; font-weight: 600; font-size: 26px; color: #24324e; transform: rotate(2.5deg)">弓兵</span>
        <span style="font-size: 11px; color: #6e5a43; text-align: right">細いペン・几帳面<br>印：矢</span>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 52px">
        <span style="font-family: 'Zen Kurenaido', sans-serif; font-size: 28px; color: #3a2a45; transform: rotate(-6deg)">僧侶</span>
        <span style="font-size: 11px; color: #6e5a43; text-align: right">やわらかい筆・右下がり<br>印：光の輪</span>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <a href="Main.html" style="height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px; border: 1.5px solid #7a5716; background: #b98a2c; color: #1f160f; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; box-shadow: inset 0 1px 0 #e0b85c; text-decoration: none">
        <svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#1f160f" stroke-width="1.8" aria-hidden="true"><rect x="6" y="2" width="8" height="9" rx="2"></rect><path d="M3 14 H17 V17 H3 Z"></path><path d="M5 20 H15"></path></svg>判を押して送り出す
      </a>
      <a href="Main.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; border: 1px solid #6a5340; background: transparent; color: #d9ccb4; font-size: 15px; text-decoration: none">やめる</a>
    </div>
  </aside>
</div>

</body>
</html>
