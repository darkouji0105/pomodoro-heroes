<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>設定</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#140f0c;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca}
button{font-family:inherit;cursor:pointer}
a{color:#d4a640}a:hover{color:#e9c46a}
:root{--ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");--wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>")}
.tip{position:relative;outline:none}.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#2b2118;color:#f1e6cf;font-size:12px;font-weight:500;font-family:'Noto Sans JP',sans-serif;z-index:5;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}.tip:focus-visible{box-shadow:0 0 0 2px #9c7424;border-radius:3px}
.glow{box-shadow:0 0 0 1.5px #d4a640, 0 0 14px rgba(224,184,92,.55)}

</style>

</head>
<body>

<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1d1612 var(--wtex); color: #eadfca; font-family: 'Noto Sans JP', sans-serif; overflow: hidden"><header style="position: relative; height: 70px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #16100d; border-bottom: 1px solid #5a4330; box-shadow: 0 1px 0 #2a1f18, 0 3px 0 #16100d, 0 4px 0 #3a2c22; z-index: 1">
<div style="display: flex; align-items: center; gap: 20px"><a href="Main.html" style="height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 6px; border: 1.5px solid #a8791f; background: #4a3526; color: #f1e6cf; font-size: 15px; text-decoration: none"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#d4a640" stroke-width="1.8" aria-hidden="true"><path d="M9 2 L4 7 L9 12"></path></svg>戻る</a><div style="display: flex; align-items: center; gap: 12px"><span style="width: 7px; height: 7px; transform: rotate(45deg); background: #d4a640; flex-shrink: 0"></span><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 24px; letter-spacing: 0.25em; color: #f1e6cf; text-shadow: 0 2px 0 #000">設定</span></div><span style="width: 7px; height: 7px; transform: rotate(45deg); background: #d4a640; flex-shrink: 0"></span></div></div>
<span></span></header><main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 12px 120px 26px; display: flex; flex-direction: column">
<div style="height: 44px; flex-shrink: 0; display: flex; align-items: flex-end; gap: 4px; padding-left: 10px"><button aria-pressed="false" style="height: 38px; align-self: flex-end; padding: 0 22px; border: none; border-radius: 8px 8px 0 0; background: #bfa97f; color: #2b2118; font-size: 15px; font-weight: 400; box-shadow: 0 -2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 6px">表示</button><button aria-pressed="false" style="height: 38px; align-self: flex-end; padding: 0 22px; border: none; border-radius: 8px 8px 0 0; background: #bfa97f; color: #2b2118; font-size: 15px; font-weight: 400; box-shadow: 0 -2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 6px">音</button><button aria-pressed="true" style="height: 44px; align-self: flex-end; padding: 0 22px; border: none; border-radius: 8px 8px 0 0; background: #e9dcc0; color: #2b2118; font-size: 15px; font-weight: 700; box-shadow: 0 -2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 6px">ポモドーロと小窓</button><button aria-pressed="false" style="height: 38px; align-self: flex-end; padding: 0 22px; border: none; border-radius: 8px 8px 0 0; background: #bfa97f; color: #2b2118; font-size: 15px; font-weight: 400; box-shadow: 0 -2px 6px rgba(0,0,0,0.25); display: flex; align-items: center; gap: 6px">データ</button></div>
<div style="position: relative; flex-grow: 1; min-height: 0; box-sizing: border-box; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 0 4px 4px 4px; box-shadow: 0 10px 22px rgba(0,0,0,0.45), inset 0 0 30px rgba(107,86,56,0.18); padding: 22px 34px">


<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid #2b2118"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 20px; letter-spacing: 0.15em; color: #2b2118">ポモドーロと小窓</span></div><div style="display: flex; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px dashed #c2ae88"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">集中の長さ</span></span><div style="display: flex; border: 1px solid #8a7458; border-radius: 4px; overflow: hidden"><button style="height: 36px; padding: 0 16px; border: none; background: #4a3526; color: #f1e6cf;  font-size: 13px">25分</button><button style="height: 36px; padding: 0 16px; border: none; background: transparent; color: #2b2118; border-left: 1px solid #8a7458; font-size: 13px">45分</button><button style="height: 36px; padding: 0 16px; border: none; background: transparent; color: #2b2118; border-left: 1px solid #8a7458; font-size: 13px">50分</button></div></div><div style="display: flex; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px dashed #c2ae88"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">休憩の長さ</span></span><div style="display: flex; border: 1px solid #8a7458; border-radius: 4px; overflow: hidden"><button style="height: 36px; padding: 0 16px; border: none; background: #4a3526; color: #f1e6cf;  font-size: 13px">5分</button><button style="height: 36px; padding: 0 16px; border: none; background: transparent; color: #2b2118; border-left: 1px solid #8a7458; font-size: 13px">10分</button><button style="height: 36px; padding: 0 16px; border: none; background: transparent; color: #2b2118; border-left: 1px solid #8a7458; font-size: 13px">15分</button></div></div><div style="display: flex; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px dashed #c2ae88"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">ポモドーロ中は小窓にする</span><span style="font-size: 12px; color: #6e5a43">ポモドーロのあいだだけ、デスクトップの隅に本部の一角を出す。終わると閉じる</span></span><button role="switch" aria-checked="true" aria-label="小窓" style="width: 52px; height: 28px; padding: 0; border-radius: 14px; border: 1px solid #7a5716; background: #b98a2c; position: relative"><span style="position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #f5ecd8; box-shadow: 0 1px 2px rgba(0,0,0,0.4)"></span></button></div><div style="display: flex; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px dashed #c2ae88"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">小窓をいつも前に出す</span><span style="font-size: 12px; color: #6e5a43">ポモドーロ中のみ</span></span><button role="switch" aria-checked="true" aria-label="最前面" style="width: 52px; height: 28px; padding: 0; border-radius: 14px; border: 1px solid #7a5716; background: #b98a2c; position: relative"><span style="position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #f5ecd8; box-shadow: 0 1px 2px rgba(0,0,0,0.4)"></span></button></div><div style="display: flex; align-items: center; gap: 16px; min-height: 62px; border-bottom: 1px dashed #c2ae88"><span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 15px">休憩に入ったら話しかける</span></span><button role="switch" aria-checked="true" aria-label="話しかける" style="width: 52px; height: 28px; padding: 0; border-radius: 14px; border: 1px solid #7a5716; background: #b98a2c; position: relative"><span style="position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #f5ecd8; box-shadow: 0 1px 2px rgba(0,0,0,0.4)"></span></button></div>

</div></main></div>

</body>
</html>
