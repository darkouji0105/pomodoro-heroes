<!doctype html>

<style>

.tip{position:relative;outline:none}.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#2b2118;color:#f1e6cf;font-size:12px;font-weight:500;font-family:'Noto Sans JP',sans-serif;z-index:5;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}.tip:focus-visible{box-shadow:0 0 0 2px #9c7424;border-radius:3px}
.glow{box-shadow:0 0 0 1.5px #d4a640, 0 0 14px rgba(224,184,92,.55)}
@keyframes rise{0%{opacity:0;transform:translateY(40px) rotate(var(--r,0deg)) scale(.85)}100%{opacity:1;transform:translateY(0) rotate(var(--r,0deg)) scale(1)}}
.tag{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}.tag2{animation-delay:.15s}.tag3{animation-delay:.3s}

</style>

<body>

<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1d1612 var(--wtex); color: #eadfca; font-family: 'Noto Sans JP', sans-serif; overflow: hidden"><header style="position: relative; height: 70px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #16100d; border-bottom: 1px solid #5a4330; box-shadow: 0 1px 0 #2a1f18, 0 3px 0 #16100d, 0 4px 0 #3a2c22; z-index: 1">

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px"><button style="height: 48px; border-radius: 6px; border: 1.5px solid #5a4330; background: #4a3526; color: #f1e6cf; font-size: 15px">まとめて開ける</button></div></section>
<section style="position: relative; border-radius: 10px; background: #231a15; border: 1px solid #3a2c22; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 150px; background: #2e2219; border-top: 2px solid #3f3024"></div>

<div style="position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center">
<div style="display: flex; gap: 22px; align-items: flex-start; margin-top: 44px"><div class="tag " style="--r: -5deg; position: relative; width: 170px; height: 210px; box-sizing: border-box; padding: 16px; margin-top: 0px; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 4px; box-shadow: 0 10px 22px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 6px solid #d4a640">
<span style="font-size: 11px; color: #6e5a43">素材</span>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#8a6414" stroke-width="2.4" aria-hidden="true"><path d="M8 40 L22 24 H42 L56 40 L42 50 H22 Z"></path><path d="M22 24 L32 40 L42 24 M8 40 H56"></path></svg>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 21px; text-align: center">金材</span>
<span style="margin-top: auto; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 15px">×1</span></div><div class="tag tag2" style="--r: 1deg; position: relative; width: 170px; height: 210px; box-sizing: border-box; padding: 16px; margin-top: -18px; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 4px; box-shadow: 0 10px 22px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 6px solid #d4a640">
<span style="font-size: 11px; color: #6e5a43">素材</span>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#8a6414" stroke-width="2.4" aria-hidden="true"><path d="M14 26 H44 C44 36 38 38 32 38 H28 L26 46 H40 V54 H18 V46 L20 38 C16 38 14 32 14 26 Z"></path><path d="M44 26 L54 20"></path></svg>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 21px; text-align: center">鍛冶の極</span>
<span style="margin-top: auto; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 15px">×1</span></div><div class="tag tag3" style="--r: 6deg; position: relative; width: 170px; height: 210px; box-sizing: border-box; padding: 16px; margin-top: 0px; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 4px; box-shadow: 0 10px 22px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; border-top: 6px solid #6d8bb3"><span aria-label="初めて手に入れた" style="position: absolute; top: -2px; right: 14px; width: 12px; height: 26px; background: #9c3a2e; clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); box-shadow: 0 2px 2px rgba(0,0,0,0.4); z-index: 2"></span>
<span style="font-size: 11px; color: #6e5a43">装飾・宝石</span>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="#3f5f8a" stroke-width="2.4" aria-hidden="true"><path d="M32 8 L52 32 L32 56 L12 32 Z"></path><path d="M12 32 H52 M32 8 V56"></path></svg>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 21px; text-align: center">攻撃の宝石①</span>
<span style="margin-top: auto; font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 15px">×1</span></div></div>
<svg width="200" height="120" viewBox="0 0 230 140" fill="none" aria-hidden="true" style="margin-top: 14px"><path d="M20 50 H210 V132 H20 Z" fill="#4a3526" stroke="#d4a640" stroke-width="3"></path><path d="M20 50 L40 6 H190 L210 50" fill="#2b2118" stroke="#d4a640" stroke-width="3"></path><path d="M60 50 V132 M170 50 V132" stroke="#a8791f" stroke-width="6"></path></svg>
<div style="position: absolute; left: 28px; right: 28px; bottom: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px"><span style="font-size: 13px; color: #cbbca3">持ち物に入れた</span><button style="height: 52px; padding: 0 28px; border-radius: 8px; border: 1.5px solid #7a5716; background: #b98a2c; color: #1f160f; font-size: 16px; font-weight: 700; box-shadow: inset 0 1px 0 #e0b85c">次を開ける（あと <span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums">5</span>）</button></div></div>

</section></main></div>
