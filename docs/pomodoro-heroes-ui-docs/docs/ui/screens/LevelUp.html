<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>昇級</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#140f0c;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca}
button{font-family:inherit;cursor:pointer}
a{color:#d4a640}a:hover{color:#e9c46a}
:root{--ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");--wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>")}
.tip{position:relative;outline:none}.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#2b2118;color:#f1e6cf;font-size:12px;font-weight:500;font-family:'Noto Sans JP',sans-serif;z-index:5;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}.tip:focus-visible{box-shadow:0 0 0 2px #9c7424;border-radius:3px}
.glow{box-shadow:0 0 0 1.5px #d4a640, 0 0 14px rgba(224,184,92,.55)}
@keyframes slam{0%{opacity:0;transform:rotate(-12deg) scale(2)}60%{opacity:1;transform:rotate(-12deg) scale(.92)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
.slam{animation:slam .5s ease-out both .2s}.up{animation:up .4s ease-out both}.up2{animation-delay:.5s}.up3{animation-delay:.7s}.up4{animation-delay:.9s}
@media (prefers-reduced-motion: reduce){.slam,.up{animation:none}}
</style>

</head>
<body>

<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1d1612 var(--wtex); color: #eadfca; font-family: 'Noto Sans JP', sans-serif; overflow: hidden"><header style="position: relative; height: 70px; flex-shrink: 0; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: #16100d; border-bottom: 1px solid #5a4330; box-shadow: 0 1px 0 #2a1f18, 0 3px 0 #16100d, 0 4px 0 #3a2c22; z-index: 1">
<div style="display: flex; align-items: center; gap: 20px"><a href="Main.html" style="height: 44px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 6px; border: 1.5px solid #a8791f; background: #4a3526; color: #f1e6cf; font-size: 15px; text-decoration: none"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#d4a640" stroke-width="1.8" aria-hidden="true"><path d="M9 2 L4 7 L9 12"></path></svg>戻る</a><div style="display: flex; align-items: center; gap: 12px"><span style="width: 7px; height: 7px; transform: rotate(45deg); background: #d4a640; flex-shrink: 0"></span><div style="display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 24px; letter-spacing: 0.25em; color: #f1e6cf; text-shadow: 0 2px 0 #000">昇級</span><span style="font-size: 11px; letter-spacing: 0.3em; color: #a8987f">剣士</span></div><span style="width: 7px; height: 7px; transform: rotate(45deg); background: #d4a640; flex-shrink: 0"></span></div></div>
<div style="display: flex; align-items: center; gap: 2px; padding: 4px; background: #33261d; border: 1px solid #5a4330; border-radius: 10px">
<div style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#d4a640" stroke-width="1.6" aria-label="ゴールド"><circle cx="9" cy="9" r="7"></circle><circle cx="9" cy="9" r="3.5"></circle></svg><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 16px">270</span></div>
<div style="width: 1px; height: 22px; background: #5a4330"></div>
<div style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#8fc3d6" stroke-width="1.6" aria-label="宝石"><path d="M4 7 L7 3 H11 L14 7 L9 15 Z"></path><path d="M4 7 H14"></path></svg><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 16px">0</span></div>
<div style="width: 1px; height: 22px; background: #5a4330"></div>
<div style="display: flex; align-items: center; gap: 7px; padding: 6px 12px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#9cc98a" stroke-width="1.6" aria-label="スタミナ"><path d="M10 2 L4 10 H9 L8 16 L14 8 H9 Z"></path></svg><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 16px">5<span style="color: #a8987f; font-size: 12px; font-weight: 500"> / 100</span></span></div></div></header><main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 22px 40px 24px">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 30px; height: 100%">
<section style="position: relative; padding: 26px 32px; background: #e9dcc0 var(--ptex); color: #2b2118; box-shadow: inset 0 0 40px rgba(120,88,40,0.35), 0 14px 28px rgba(0,0,0,0.6); border-radius: 3px; transform: rotate(-0.6deg); display: flex; flex-direction: column; gap: 14px"><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px"></span>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 20px; letter-spacing: 0.6em">昇 級 申 請 書</span><div style="display: flex; align-items: center; gap: 8px; width: 60%"><span style="flex-grow: 1; height: 0; border-top: 1px solid #9c7424"></span><span style="width: 6px; height: 6px; transform: rotate(45deg); background: #9c7424"></span><span style="width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid #9c7424"></span><span style="width: 6px; height: 6px; transform: rotate(45deg); background: #9c7424"></span><span style="flex-grow: 1; height: 0; border-top: 1px solid #9c7424"></span></div></div>
<div style="display: flex; align-items: center; gap: 24px; padding: 6px 0"><div style="position: relative; padding: 5px; background: #f5ecd8; box-shadow: 0 3px 8px rgba(0,0,0,0.35); transform: rotate(-3deg)"><div style="width: 90px; height: 106px; background: #4b3a63; display: flex; align-items: flex-end; justify-content: center; overflow: hidden"><svg width="82" height="96" viewBox="0 0 70 84" fill="rgba(0,0,0,0.35)" aria-label="剣士の顔写真（仮）"><circle cx="35" cy="32" r="16"></circle><path d="M6 84 C6 60 19 51 35 51 C51 51 64 60 64 84 Z"></path></svg></div></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 32px">剣士</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 56px; line-height: 1">1<span style="font-size: 26px; color: #9c7424"> → </span>2</span></div></div>
<div class="" style="display: flex; align-items: center; gap: 12px; height: 50px; border-bottom: 1px dotted #b39d74"><span style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #9c7424; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#6e5a43" stroke-width="1.7" aria-hidden="true"><circle cx="5" cy="5" r="2"></circle><circle cx="15" cy="5" r="2"></circle><circle cx="10" cy="15" r="2"></circle></svg></span><span style="font-size: 15px; flex-grow: 1">ステータスノードの点</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 20px; color: #3f7a2e">+1</span></div><div class="" style="display: flex; align-items: center; gap: 12px; height: 50px; border-bottom: 1px dotted #b39d74"><span style="width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid #9c7424; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#6e5a43" stroke-width="1.7" aria-hidden="true"><path d="M4 16 L16 4 M10 4 H16 V10"></path></svg></span><span style="font-size: 15px; flex-grow: 1">次に覚えるスキル（Lv5）</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 20px; color: #3f7a2e"></span><span style="font-size: 14px">捨て身の一撃</span></div>
<div style="margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between"><span style="font-size: 12px; color: #6e5a43">承認　ギルドマスター</span><span style="width: 84px; height: 84px; border-radius: 50%; border: 1.5px dashed #b39d74; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #6e5a43">ここに判</span></div></section>
<aside style="display: flex; flex-direction: column; gap: 16px">
<div style="padding: 18px 20px; background: #e9dcc0 var(--ptex); color: #2b2118; box-shadow: inset 0 0 40px rgba(120,88,40,0.35), 0 14px 28px rgba(0,0,0,0.6); border-radius: 3px"><span style="font-size: 12px; color: #6e5a43">使うもの</span><div style="display: flex; align-items: center; gap: 10px; margin-top: 8px"><div style="position: relative; width: 44px; height: 44px; flex-shrink: 0; "><svg width="44" height="44" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#241b16" stroke="#e0b040" stroke-width="2.5"></circle><circle cx="32" cy="32" r="24" fill="none" stroke="#e0b040" stroke-width="0.8" opacity="0.35"></circle><g fill="none" stroke="#efe5d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="27" r="9"></circle><path d="M27 34 L24 47 L32 43 L40 47 L37 34"></path></g></svg></div><span style="font-size: 15px; flex-grow: 1">修練の証</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 22px">3</span></div><div style="margin-top: 8px; font-size: 13px; color: #4f4030">のこり <b style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 15px">57 → 54</b></div></div>
<div style="display: flex; align-items: flex-start; gap: 12px"><span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: #4b3a63; border: 2px solid #8a78a8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#efe4ff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 16 L14 6 M12 4 L16 8 M5 13 L7 15"></path></svg></span><div style="position: relative; padding: 10px 14px; background: #f3e9d2; color: #2b2118; border-radius: 10px; font-size: 14px; line-height: 1.6; box-shadow: 0 4px 10px rgba(0,0,0,0.4)"><b style="font-size: 11px; color: #6e5a43">剣士</b><br>稽古の成果、見せてやる。<span style="position: absolute; left: -6px; top: 16px; width: 12px; height: 12px; background: #f3e9d2; transform: rotate(45deg)"></span></div></div>
<button style="margin-top: auto; height: 58px; border-radius: 8px; border: 1.5px solid #7a5716; background: #b98a2c; color: #1f160f; font-size: 17px; font-weight: 700; letter-spacing: 0.1em; box-shadow: inset 0 1px 0 #e0b85c">判を押して昇級させる</button>
<a href="Character.html" style="height: 46px; display: flex; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid #6a5340; color: #d9ccb4; font-size: 14px; text-decoration: none">やめる</a></aside></div>
</main></div>

</body>
</html>
