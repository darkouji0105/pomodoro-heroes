<span style="position: absolute; top: -14px; right: 18px; padding: 4px 10px; border: 2.5px solid #9c3a2e; border-radius: 4px; color: #9c3a2e; background: rgba(233,220,192,0.9); font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 13px; transform: rotate(6deg)">全部なくす</span>

<span style="font-size: 12px; color: #6e5a43">装備・レベル・研究はなくならない</span>
<div style="display: flex; gap: 10px; margin-top: 4px"><button autofocus style="flex: 1; height: 50px; border-radius: 6px; border: 1.5px solid #5a4330; background: #4a3526; color: #f1e6cf; font-size: 15px">やめる</button><button style="flex: 1; height: 50px; border-radius: 6px; border: 1.5px solid #6e2219; background: #8a3327; color: #fbeee6; font-size: 15px; font-weight: 700">降りる</button></div></div><div role="dialog" aria-label="はじめからやり直す" style="position: relative; width: 360px; padding: 24px 24px 20px; background: #e9dcc0 var(--ptex); color: #2b2118; box-shadow: inset 0 0 40px rgba(120,88,40,0.35), 0 18px 40px rgba(0,0,0,0.7); border-radius: 3px; display: flex; flex-direction: column; gap: 14px"><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; top: 8px; left: 8px; border-top-width: 2px; border-left-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; top: 8px; right: 8px; border-top-width: 2px; border-right-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; bottom: 8px; left: 8px; border-bottom-width: 2px; border-left-width: 2px"></span><span style="position: absolute; width: 16px; height: 16px; border-color: #9c7424; border-style: solid; border-width: 0; bottom: 8px; right: 8px; border-bottom-width: 2px; border-right-width: 2px"></span>
<span style="position: absolute; top: -14px; right: 18px; padding: 4px 10px; border: 2.5px solid #9c3a2e; border-radius: 4px; color: #9c3a2e; background: rgba(233,220,192,0.9); font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 13px; transform: rotate(6deg)">消える</span>
