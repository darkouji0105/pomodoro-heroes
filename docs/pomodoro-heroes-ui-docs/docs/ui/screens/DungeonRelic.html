<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レリックを選ぶ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#140f0c;font-family:"Noto Sans JP","Hiragino Sans",sans-serif;color:#eadfca}
button{font-family:inherit;cursor:pointer}
a{color:#d4a640}a:hover{color:#e9c46a}
:root{--ptex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.14  0 0 0 0.22 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");--wtex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='w'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.4' numOctaves='3' seed='8'/><feColorMatrix values='0 0 0 0 0.3  0 0 0 0 0.2  0 0 0 0 0.12  0 0 0 0.35 0'/></filter><rect width='300' height='300' filter='url(%23w)'/></svg>")}
.tip{position:relative;outline:none}.tip:hover::after,.tip:focus-visible::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#2b2118;color:#f1e6cf;font-size:12px;font-weight:500;font-family:'Noto Sans JP',sans-serif;z-index:5;pointer-events:none;box-shadow:0 3px 8px rgba(0,0,0,.4)}.tip:focus-visible{box-shadow:0 0 0 2px #9c7424;border-radius:3px}
.glow{box-shadow:0 0 0 1.5px #d4a640, 0 0 14px rgba(224,184,92,.55)}

</style>

</head>
<body>

<div style="width: 1280px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1d1612 var(--wtex); color: #eadfca; font-family: 'Noto Sans JP', sans-serif; overflow: hidden"><header style="height: 62px; flex-shrink: 0; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; background: #231a15; border-bottom: 2px solid #3a2c22">
<div style="display: flex; align-items: baseline; gap: 14px"><span style="font-size: 13px; color: #a8987f; letter-spacing: 0.1em">難ダンジョン</span><span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 30px; color: #f1e6cf">35<span style="font-size: 15px; font-weight: 700"> 層</span></span><span style="font-size: 13px; color: #cbbca3"></span></div>
<div style="display: flex; align-items: center; gap: 14px; padding: 6px 14px; background: #33261d; border: 1px solid #5a4330; border-radius: 10px"><span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="26" viewBox="0 0 22 30" aria-label="たいまつ"><path d="M11 2 C15 7 17 9 17 12.5 C17 16 14.5 18 11 18 C7.5 18 5 16 5 12.5 C5 9.5 8 7.5 11 2 Z" fill="#e0782e"></path><path d="M11 8 C13 10.5 14 11.5 14 13.5 C14 15.5 12.7 16.5 11 16.5 C9.3 16.5 8 15.5 8 13.5 C8 11.8 9.5 10.5 11 8 Z" fill="#ffd36b"></path><path d="M7 18 H15 L13 29 H9 Z" fill="#6b4a2e"></path></svg><span style="display: flex; gap: 3px"><span style="width: 6px; height: 14px; border-radius: 2px; background: #e0a040"></span><span style="width: 6px; height: 14px; border-radius: 2px; background: #4a382a"></span><span style="width: 6px; height: 14px; border-radius: 2px; background: #4a382a"></span><span style="width: 6px; height: 14px; border-radius: 2px; background: #4a382a"></span></span></span><span style="width: 1px; height: 18px; background: #5a4330"></span><span style="display: flex; align-items: center; gap: 6px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#d4a640" stroke-width="1.6" aria-label="コイン"><circle cx="9" cy="9" r="7"></circle><path d="M9 5 V13 M6.5 7 H11"></path></svg><b style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 17px">58</b></span></div></header><main style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 28px 110px; display: flex; flex-direction: column; gap: 24px">
<div style="text-align: center; font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 28px; letter-spacing: 0.2em; color: #f1e6cf">レリックを1つ</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px">
<button style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 22px 22px; border-radius: 4px; border: none; background: #e9dcc0 var(--ptex); box-shadow: 0 10px 22px rgba(0,0,0,0.45); color: #2b2118; transform: rotate(-0.8deg)">
<div style="position: relative; width: 92px; height: 92px; flex-shrink: 0; "><svg width="92" height="92" viewBox="0 0 64 64" aria-hidden="true"><polygon points="21,3 43,3 61,21 61,43 43,61 21,61 3,43 3,21" fill="#241b16" stroke="#58a7ee" stroke-width="2.5"></polygon><polygon points="23,8 41,8 56,23 56,41 41,56 23,56 8,41 8,23" fill="none" stroke="#58a7ee" stroke-width="0.8" opacity="0.35"></polygon><g fill="none" stroke="#efe5d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19 H41 V31 C41 39 37 43 32 46 C27 43 23 39 23 31 Z"></path><path d="M32 23 V41 M26 30 H38"></path></g></svg></div>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 24px">戦旗</span>
<span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 26px; color: #7a5716">攻撃 +15%</span>
<span style="width: 100%; padding-top: 10px; border-top: 1px dashed #c2ae88; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #4f4030"><svg width="30" height="14" viewBox="0 0 30 14" fill="#6e5a43" aria-hidden="true"><circle cx="5" cy="5" r="3"></circle><circle cx="15" cy="5" r="3"></circle><circle cx="25" cy="5" r="3"></circle><path d="M0 14 C0 10 2 9 5 9 C8 9 10 10 10 14 Z M10 14 C10 10 12 9 15 9 C18 9 20 10 20 14 Z M20 14 C20 10 22 9 25 9 C28 9 30 10 30 14 Z"></path></svg>全員</span></button>
<button style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 22px 22px; border-radius: 4px; border: none; background: #f4ead3; box-shadow: inset 0 0 0 2px #9c7424, 0 10px 22px rgba(0,0,0,0.45); color: #2b2118; transform: rotate(0.5deg)"><span style="position: absolute; top: 14px; right: 14px; padding: 2px 8px; border: 2px solid #9c3a2e; color: #9c3a2e; border-radius: 3px; font-size: 12px; font-weight: 700; transform: rotate(8deg)">選んだ</span>
<div style="position: relative; width: 92px; height: 92px; flex-shrink: 0; "><svg width="92" height="92" viewBox="0 0 64 64" aria-hidden="true"><polygon points="21,3 43,3 61,21 61,43 43,61 21,61 3,43 3,21" fill="#241b16" stroke="#e0b040" stroke-width="2.5"></polygon><polygon points="23,8 41,8 56,23 56,41 41,56 23,56 8,41 8,23" fill="none" stroke="#e0b040" stroke-width="0.8" opacity="0.35"></polygon><g fill="none" stroke="#efe5d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 28 L27 20 H37 L43 28 L32 45 Z"></path><path d="M21 28 H43"></path><path d="M27 20 L32 28 L37 20"></path></g></svg></div>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 24px">猛き宝玉</span>
<span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 26px; color: #7a5716">攻撃 +35%</span>
<span style="width: 100%; padding-top: 10px; border-top: 1px dashed #c2ae88; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #4f4030"><svg width="12" height="14" viewBox="0 0 10 14" fill="#9c7424" aria-hidden="true"><circle cx="5" cy="5" r="3"></circle><path d="M0 14 C0 10 2 9 5 9 C8 9 10 10 10 14 Z"></path></svg>1人</span></button>
<button style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 30px 22px 22px; border-radius: 4px; border: none; background: #e9dcc0 var(--ptex); box-shadow: 0 10px 22px rgba(0,0,0,0.45); color: #2b2118; transform: rotate(-0.3deg)">
<div style="position: relative; width: 92px; height: 92px; flex-shrink: 0; "><svg width="92" height="92" viewBox="0 0 64 64" aria-hidden="true"><polygon points="21,3 43,3 61,21 61,43 43,61 21,61 3,43 3,21" fill="#241b16" stroke="#58a7ee" stroke-width="2.5"></polygon><polygon points="23,8 41,8 56,23 56,41 41,56 23,56 8,41 8,23" fill="none" stroke="#58a7ee" stroke-width="0.8" opacity="0.35"></polygon><g fill="none" stroke="#efe5d2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M24 18 L32 29 L40 18"></path><circle cx="32" cy="37" r="8"></circle><circle cx="32" cy="37" r="3"></circle></g></svg></div>
<span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 24px">鷹の目</span>
<span style="font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-variant-numeric: tabular-nums; font-size: 26px; color: #7a5716">会心率 +12</span>
<span style="width: 100%; padding-top: 10px; border-top: 1px dashed #c2ae88; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; color: #4f4030"><svg width="30" height="14" viewBox="0 0 30 14" fill="#6e5a43" aria-hidden="true"><circle cx="5" cy="5" r="3"></circle><circle cx="15" cy="5" r="3"></circle><circle cx="25" cy="5" r="3"></circle><path d="M0 14 C0 10 2 9 5 9 C8 9 10 10 10 14 Z M10 14 C10 10 12 9 15 9 C18 9 20 10 20 14 Z M20 14 C20 10 22 9 25 9 C28 9 30 10 30 14 Z"></path></svg>全員</span></button>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 14px 20px; background: #e9dcc0 var(--ptex); color: #2b2118; border-radius: 4px; box-shadow: 0 8px 18px rgba(0,0,0,0.45)"><span style="font-family: 'Shippori Mincho B1', serif; font-weight: 800; font-size: 16px; letter-spacing: 0.15em; color: #2b2118">付ける人</span>
<div style="display: flex; align-items: center; gap: 10px"><button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 8px; border-radius: 28px; border: 1px solid #c2ae88; background: transparent; color: #2b2118; font-size: 15px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #2f4666; border: 1.5px solid #6d8bb3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#e4eeff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 4 V17"></path><circle cx="10" cy="4" r="2"></circle><path d="M6 8 H14"></path></svg></span>僧侶</button><button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 8px; border-radius: 28px; border: 1px solid #c2ae88; background: transparent; color: #2b2118; font-size: 15px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #34553b; border: 1.5px solid #6f9a74; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#e6f5e4" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 3 C12 6 12 14 6 17"></path><path d="M6 3 V17"></path><path d="M4 10 H16 M13.5 7.5 L16 10 L13.5 12.5"></path></svg></span>弓兵</button><button style="display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 20px 0 8px; border-radius: 28px; border: 1.5px solid #9c7424; background: #f4ead3; color: #2b2118; font-size: 15px"><span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 50%; background: #4b3a63; border: 1.5px solid #8a78a8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#efe4ff" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 16 L14 6 M12 4 L16 8 M5 13 L7 15"></path></svg></span>剣士</button></div>
<button style="height: 54px; padding: 0 18px; border-radius: 6px; border: 1.5px solid #7a5716; background: #b98a2c; color: #1f160f; font-weight: 700; box-shadow: inset 0 1px 0 #e0b85c; font-size: 15px; padding: 0 32px; font-size: 16px">剣士に付ける</button></div>
</main></div>

</body>
</html>
